# sonar-project.properties — read by the `sonarqube-scan` job in .github/workflows/ci.yml
# GitHub org/login on sonarcloud.io
sonar.organization=josiahsiegel
# Convention: <org>_<repo>
sonar.projectKey=JosiahSiegel_umactually

# Operator setup is documented in docs/configuration.md ("SonarCloud
# integration"). After the SONAR_TOKEN secret is added to repo
# settings, this file is stable. Quality gate tuning lives in the
# SonarCloud UI, not here.

sonar.projectName=umactually
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Analyse production source only (src + bin + scripts). test/ is configured
# under sonar.tests and must NOT also appear under sonar.sources, otherwise
# the scanner rejects the run with "can't be indexed twice" on every
# .ts/.mjs/.json file under test/ (matches both passes). Production source
# lives in src, bin, and scripts; test fixtures and harnesses are
# intentionally excluded from the main-source analysis.
sonar.sources=src,bin,scripts
sonar.tests=test
sonar.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**, **/.trunk/**, **/coverage/**, **/*.d.ts
sonar.test.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**
sonar.coverage.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**, **/test/**, **/*.test.ts, **/*.scenario.test.ts, **/*.e2e.test.ts, scripts/**, bin/**

# TypeScript coverage + tsconfig inputs (vitest writes coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.test.json