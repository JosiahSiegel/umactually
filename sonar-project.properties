# sonar-project.properties — read by the `sonarqube-scan` job in .github/workflows/ci.yml
# GitHub org/login on sonarcloud.io
sonar.organization=josiahsiegel
# Convention: <org>_<repo>
sonar.projectKey=JosiahSiegel_umactually

# Operator setup is documented in docs/configuration.md ("SonarCloud
# integration"). After the SONAR_TOKEN secret is added to repo
# settings, this file is stable. Quality gate tuning lives in the
# SonarCloud UI, not here.

sonar.projectName=umactually
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8
# Default to SonarCloud. Operators targeting a self-hosted SonarQube
# override this on the scanner command line, e.g.:
#   npx --yes sonarqube-scanner -Dsonar.host.url=https://sonar.example.com
# The CI workflow (sonarqube-scan job in .github/workflows/ci.yml) does
# NOT pass SONAR_HOST_URL; it relies on this default. That keeps the
# workflow host-agnostic — the same workflow works for any project,
# not just SonarCloud.
sonar.host.url=https://sonarcloud.io

# Analyse production source only (src + bin). test/ is configured
# under sonar.tests and must NOT also appear under sonar.sources, otherwise
# the scanner rejects the run with "can't be indexed twice" on every
# .ts/.mjs/.json file under test/ (matches both passes).
#
# Why not scripts/? scripts/ is CI/release glue (build-sea.mjs,
# check-*.mjs, install.sh, etc.) with no unit tests. Including it in
# sources but not in coverage would report 0% coverage on those paths
# in SonarCloud, dragging the project's coverage metric down without
# surfacing real signal. scripts/ stays out of sonar.sources AND out
# of vitest's coverage.include (vitest.config.ts), keeping both
# metrics in lockstep.
sonar.sources=src,bin
sonar.tests=test
sonar.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**, **/.trunk/**, **/coverage/**, **/*.d.ts
sonar.test.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**
sonar.coverage.exclusions=**/node_modules/**, **/dist/**, **/release/**, **/artifacts/**, **/test/**, **/*.test.ts, **/*.scenario.test.ts, **/*.e2e.test.ts, scripts/**

# TypeScript coverage + tsconfig inputs (vitest writes coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.test.json