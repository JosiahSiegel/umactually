# Azure DevOps pipeline entrypoint for this repository.
#
# For Azure Repos, attach this YAML to a branch policy build validation policy.
# The pr: trigger is honored only for GitHub/Bitbucket Cloud repositories that
# are connected to Azure Pipelines.
trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  - group: umactually-secrets
  - name: NODE_VERSION
    value: "24.x"
  - name: AZURE_ARTIFACT_DIR
    value: artifacts/manual
  - name: AZURE_EVENT_PATH
    value: artifacts/manual/azure-event.json
  - name: AZURE_DIFF_PATH
    value: artifacts/manual/azure-pr.diff
  - name: AZURE_REVIEW_PATH
    value: artifacts/manual/azure-review.json
  - name: AZURE_OUTPUT_ARTIFACT
    value: artifacts/manual/s4-azure-mocked-run.json

steps:
  - checkout: self
    persistCredentials: true

  - script: mkdir -p artifacts/manual
    displayName: Initialize manual artifact directory

  - task: NodeTool@0
    displayName: Use Node $(NODE_VERSION)
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: npm ci
    displayName: Install dependencies

  - script: bash scripts/ci-validate.sh
    displayName: Run CI validation suite
    # Validation step delegates to scripts/ci-validate.sh so this
    # pipeline and examples/azure/azure-pipelines.yml share one
    # implementation of the typecheck + test + bundle + freshness gates.
    # The script also re-bundles dist/ so the Azure live review below
    # cannot silently consume a stale bundle.

  - script: bash scripts/prepare-azure-pr-inputs.sh
    displayName: Prepare Azure PR inputs
    # Prepare step delegates to scripts/prepare-azure-pr-inputs.sh so this
    # pipeline and examples/azure/azure-pipelines.yml share one
    # implementation of the synthetic-event + REST-diff-fetch logic.
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  - script: |
      set -euo pipefail
      : "${UMACTUALLY_PR_NUMBER:?UMACTUALLY_PR_NUMBER must be set by the prepare step.}"
      : "${UMACTUALLY_REPO:?UMACTUALLY_REPO must be set by the prepare step.}"
      : "${UMACTUALLY_API_URL:?UMACTUALLY_API_URL must be set as a pipeline variable.}"
      : "${UMACTUALLY_API_KEY:?UMACTUALLY_API_KEY must be set as a pipeline variable.}"
      # The project build service identity does not always hold the
      # "Contribute to pull requests" permission needed to POST PR threads
      # and statuses, which causes HTTP 403. Prefer an explicit Azure
      # DevOps PAT (from the umactually-secrets variable group) so the
      # CLI can post threads with an identity that has the right ACL.
      : "${DEVOPS_PAT:?DEVOPS_PAT must be set as a pipeline variable (umactually-secrets group).}"
      export AZURE_DEVOPS_TOKEN="${DEVOPS_PAT}"
      # Conditionally forward the optional prompt-file list inputs.
      # When set, these override the default repository prompt lookup
      # (CLAUDE.md, AGENTS.md, etc.). See docs/configuration.md and
      # docs/security.md. Both env vars are comma/newline-separated
      # paths; an empty value lets the default-lookup run.
      optional_env_value() {
        local name="$1"
        local value="${!name:-}"
        if [ -z "$value" ] || [[ "$value" == \$\(*\) ]]; then
          return 0
        fi
        printf '%s' "$value"
      }

      EXTRA_ARGS=()
      prompt_files="$(optional_env_value UMACTUALLY_PROMPT_FILES)"
      if [ -n "$prompt_files" ]; then
        EXTRA_ARGS+=(--prompt-files "$prompt_files")
      fi
      additional_prompt_files="$(optional_env_value UMACTUALLY_ADDITIONAL_PROMPT_FILES)"
      if [ -n "$additional_prompt_files" ]; then
        EXTRA_ARGS+=(--additional-prompt-files "$additional_prompt_files")
      fi
      # Purge optional env vars whose values are unresolved ADO macro
      # literals (the string "$(VAR)" left in place when the pipeline
      # variable group does not define VAR). The bash guards above
      # already filter these for CLI *args*, but the CLI's own config
      # loader reads env vars directly — a macro literal reaching
      # parseBooleanFromUnknown crashes with "expected boolean string,
      # received [REDACTED]". Unsetting before `node` keeps the env
      # path from ever seeing the unresolved macro.
      purge_if_macro() {
        local name="$1"
        local value="${!name:-}"
        if [[ "$value" == \$\(*\) ]]; then
          unset "$name"
        fi
      }
      for _var in \
        UMACTUALLY_PROMPT_FILES UMACTUALLY_ADDITIONAL_PROMPT_FILES \
        UMACTUALLY_STRICT_SCHEMA UMACTUALLY_VERIFY_FINDINGS; do
        purge_if_macro "$_var"
      done
      unset _var

      # Conditionally forward the strict-schema and verify-findings
      # toggles. Both default ON in the CLI; opt out with the
      # corresponding `false` value. Empty (unset) preserves the
      # default ON behavior — the operator only sets these to opt OUT.
      strict_schema="$(optional_env_value UMACTUALLY_STRICT_SCHEMA)"
      if [ -n "$strict_schema" ]; then
        if [ "$strict_schema" = "false" ]; then
          EXTRA_ARGS+=(--no-strict-schema)
        else
          EXTRA_ARGS+=(--strict-schema)
        fi
      fi
      verify_findings="$(optional_env_value UMACTUALLY_VERIFY_FINDINGS)"
      if [ -n "$verify_findings" ]; then
        if [ "$verify_findings" = "false" ]; then
          EXTRA_ARGS+=(--no-verify-findings)
        else
          EXTRA_ARGS+=(--verify-findings)
        fi
      fi
      node bin/umactually.mjs \
        --platform azure-devops \
        --event "$AZURE_EVENT_PATH" \
        --diff "$AZURE_DIFF_PATH" \
        --review "$AZURE_REVIEW_PATH" \
        --pr-number "$UMACTUALLY_PR_NUMBER" \
        --repo "$UMACTUALLY_REPO" \
        --api-url "${UMACTUALLY_API_URL}" \
        --api-key "${UMACTUALLY_API_KEY}" \
        --model auto \
        --per-request-timeout-seconds 180 \
        --review-file-limit 50 \
        --no-detect-leaks \
        --no-dry-run \
        "${EXTRA_ARGS[@]}"
    displayName: Run UmActually Azure live review
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      # NOTE: UMACTUALLY_PR_NUMBER + UMACTUALLY_REPO are set by the
      # prepare step via ##vso[task.setvariable]. Do NOT re-bind them
      # here — ADO locks any variable named in this env: block as
      # readonly for the entire pipeline run, which makes the prepare
      # step's setvariable emit fail with "Overwriting readonly
      # variable ... is not permitted". The script body reads them
      # from the inherited pipeline env anyway.
      UMACTUALLY_API_URL: $(UMACTUALLY_API_URL)
      UMACTUALLY_API_KEY: $(UMACTUALLY_API_KEY)
      # UMACTUALLY_PROMPT_FILES / UMACTUALLY_ADDITIONAL_PROMPT_FILES
      # are OPTIONAL pipeline variables — comma/newline-separated list
      # of repository-relative prompt files. When unset, the action
      # runs its default-lookup list (CLAUDE.md, AGENTS.md, etc.).
      UMACTUALLY_PROMPT_FILES: $(UMACTUALLY_PROMPT_FILES)
      UMACTUALLY_ADDITIONAL_PROMPT_FILES: $(UMACTUALLY_ADDITIONAL_PROMPT_FILES)
      # UMACTUALLY_STRICT_SCHEMA / UMACTUALLY_VERIFY_FINDINGS are
      # OPTIONAL boolean toggles. Default ON in the CLI; set to
      # "false" to opt out (forwards --no-strict-schema /
      # --no-verify-findings to the CLI). When unset, the CLI's
      # default ON behavior is preserved.
      UMACTUALLY_STRICT_SCHEMA: $(UMACTUALLY_STRICT_SCHEMA)
      UMACTUALLY_VERIFY_FINDINGS: $(UMACTUALLY_VERIFY_FINDINGS)
      DEVOPS_PAT: $(DEVOPS_PAT)

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Publish review artifacts
    inputs:
      targetPath: artifacts/manual
      artifact: umactually-review
