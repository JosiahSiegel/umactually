name: Feature request
description: Propose a scoped, evidence-backed improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: What reproducible workflow is blocked? Avoid solution-first or superiority claims.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract
      description: Describe inputs, outputs, failure behavior, privacy impact, and rollback.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and alternatives
      description: Link fixtures, benchmark artifacts, prior issues, or documentation.
