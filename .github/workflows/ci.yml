name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress CI runs on the same branch/PR to avoid wasted minutes
# when a new commit lands on a PR before the previous run finishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Bundle
        run: npm run bundle

      - name: Dist freshness guard
        run: npm run check:dist-freshness

      # CLI smoke scenarios — each step invokes scripts/ci-smoke.mjs with a
      # scenario id. Adding a new scenario = one entry in the SCENARIOS table
      # inside scripts/ci-smoke.mjs + one thin step here.
      - name: CLI smoke (S1 GitHub dry-run)
        run: node scripts/ci-smoke.mjs S1

      - name: CLI smoke (S4 Azure dry-run)
        run: node scripts/ci-smoke.mjs S4

      - name: CLI smoke (S5 redaction)
        run: node scripts/ci-smoke.mjs S5

      - name: CLI smoke (S6 SonarQube mocked)
        run: node scripts/ci-smoke.mjs S6

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-artifacts
          path: artifacts/manual/
          if-no-files-found: ignore