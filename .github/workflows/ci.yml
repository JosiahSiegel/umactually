name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress CI runs on the same PR to avoid wasted minutes when
# a new commit lands on a PR before the previous run finishes. Runs on
# refs/heads/main get their own concurrency group ('ci-main') with
# cancel-in-progress disabled so post-merge CI failures are never
# silently cancelled — fast-forward merge series must surface.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || 'ci-main' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Restore the npm cache that the original --cache flag used to
          # provide (the previous override hardcoded a Windows-specific
          # path under a personal user dir and broke for any other runner).
          # actions/setup-node manages the cache location automatically
          # keyed on package-lock.json.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Bundle
        run: npm run bundle

      - name: Dist freshness guard
        run: npm run check:dist-freshness

      # Local pre-merge check that mirrors the GitGuardian GitHub App's
      # secret scan. Catches new synthetic test API keys that lack a
      # SHA256 entry in .gitguardian.yaml before the GitGuardian App
      # flags them on the next PR. Exit 0 = all literals covered.
      - name: GitGuardian coverage check
        run: node scripts/verify-gitguardian-coverage.mjs

      # CLI smoke scenarios — each step invokes scripts/ci-smoke.mjs with a
      # scenario id. Adding a new scenario = one entry in the SCENARIOS table
      # inside scripts/ci-smoke.mjs + one thin step here.
      - name: CLI smoke (S1 GitHub dry-run)
        run: node scripts/ci-smoke.mjs S1

      - name: CLI smoke (S4 Azure dry-run)
        run: node scripts/ci-smoke.mjs S4

      - name: CLI smoke (S5 redaction)
        run: node scripts/ci-smoke.mjs S5

      - name: CLI smoke (S6 SonarQube mocked)
        run: node scripts/ci-smoke.mjs S6

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-artifacts
          path: artifacts/manual/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # release-pipeline-dry-run
  # ---------------------------------------------------------------------
  # Runs the same Linux-side production release pipeline locally on every
  # PR so a green merge really does guarantee the release will succeed.
  # Bridges the gap that the regular `ci` job alone cannot close: it
  # executes
  #   - the production build (npm run build, build-sea.mjs,
  #     package-release-assets.mjs, verify-release-assets.mjs) and
  #   - the canary-equivalent Linux x64 install against a fixture that
  #     masquerades as the GitHub Releases host (so URL routing matches
  #     the immutable /releases/download/<tag>/<file> shape).
  # Bails on any failure. macOS / Windows / publish-jobs in the actual
  # release workflow are not exercised here (those runners live on
  # release-only lanes); they are gated by the
  # release-workflow-contract.test.ts structural tests. This job's goal
  # is to fail-fast on the Linux lane where most regressions live.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Smoke-test the Node SEA single-file binary on Linux. This is the
  # build target that catches the most regressions for the binary
  # distribution path. macOS / Windows SEA smoke tests live on the
  # release workflow's per-target jobs
  # (smoke-darwin-x64, smoke-darwin-arm64, smoke-windows-x64,
  # smoke-windows-arm64-structural in .github/workflows/release.yml);
  # this is a fast Linux-only gate for the daily PR lane.
  # ---------------------------------------------------------------------
  smoke-sea:
    name: smoke-sea (linux x64)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile Node SEA binaries (all 6 targets; smoke tests the linux-x64 one)
        # scripts/build-sea.mjs's <targetId> argument is accepted for
        # backwards-compat but is currently a no-op: tsdown's --exe mode
        # has no per-target flag, so the config-driven build always
        # produces all 6 binaries. The smoke step below only executes
        # the linux-x64 binary, but the other 5 are built as a side
        # effect — they get uploaded as workflow artifacts and discarded.
        # Per-target filtering is tracked in a follow-up.
        run: node scripts/build-sea.mjs linux-x64

      - name: Smoke test the SEA binary
        run: |
          set -euo pipefail
          chmod +x release/umactually-linux-x64

          # --version is the first code path the SEA loader runs after
          # init (it fires before any subcommand dispatch). Capture its
          # exit status + stderr under a separate file so a loader
          # regression that crashes the binary on --version is
          # detected even if the doctor subcommand below happens to
          # mask the crash (e.g. a doctor fallback path that swallows
          # errors). The SEA loader fault contract: exit 0 with a
          # version string on stdout. Any other outcome is a crash.
          set +e
          _version_err="$(mktemp)"
          release/umactually-linux-x64 --version 2>"${_version_err}" >/dev/null
          _version_status=$?
          set -e
          if [ "$_version_status" -ne 0 ]; then
            echo "::error::SEA loader crash on --version (exit=${_version_status})"
            cat "${_version_err}" >&2 || true
            rm -f "${_version_err}"
            exit "${_version_status}"
          fi
          # Anchor the loader-fault regex to the start of a JS-level
          # stack-trace line. A real Node loader crash prints lines
          # like "Error: <message>" / "TypeError: <message>" /
          # "    at <frame> (file:line:col)" with the error line at the
          # head of the trace. Substrings like "SEA blob" / "loader
          # fault" in a stderr informational message are matched too
          # (they only appear when something is wrong), but the
          # `Error|TypeError|...:` patterns now require leading
          # whitespace (so informational prose that happens to mention
          # "Error:" mid-sentence doesn't match).
          if grep -Eq '^[[:space:]]*(Error|TypeError|SyntaxError|ReferenceError|RangeError): |bad SEA|loader fault|node:internal/' "${_version_err}"; then
            echo "::error::SEA loader crash on --version (loader-fault signature on stderr)"
            cat "${_version_err}" >&2 || true
            rm -f "${_version_err}"
            exit 1
          fi
          rm -f "${_version_err}"

          # Doctor runs the safety checks (env, deps, network). We expect
          # it to fail (no GitHub token, no LLM key) but not crash on
          # launch — the SEA loader must succeed. Doctor's documented
          # contract is exit 0 (all pass) or exit 1 (any check failed —
          # the expected missing-creds path here). Exit codes > 1 OR a
          # stderr signature matching a Node SEA loader fault (e.g.
          # "Error: cannot find module" thrown at module-load time) are
          # treated as loader crashes. The loader-fault pattern check
          # guards against a future doctor change that legitimately
          # returns exit 2 (e.g. a "permission denied" check) being
          # mis-classified as a loader crash. We grep stderr for the
          # specific Node loader-shaped errors we care about, not for a
          # raw exit code magnitude.
          #
          # Pattern set covers every common Node SEA loader fault:
          #   - Error: <message>          (cannot find module, ENOENT, etc.)
          #   - SyntaxError / TypeError / ReferenceError / RangeError
          #     (loader throws on first import)
          #   - bad SEA / SEA blob        (binary header corruption)
          #   - loader fault              (explicit @tsdown/exe failure)
          #   - node:internal/            (Node internal stack frame)
          #   - Cannot read/access propert(y/ies), "is not a function",
          #     "is not defined"          (typical module-load TypeErrors
          #                                on first require)
          set +e
          _doctor_err="$(mktemp)"
          release/umactually-linux-x64 doctor 2>"${_doctor_err}" >/dev/null
          _doctor_status=$?
          set -e
          if [ "$_doctor_status" -eq 0 ]; then
            echo "SEA loader OK (doctor exit=0, all checks passed)"
            rm -f "${_doctor_err}"
          elif [ "$_doctor_status" -eq 1 ] && ! grep -Eq '^[[:space:]]*(Error|TypeError|SyntaxError|ReferenceError|RangeError): |bad SEA|SEA blob|loader fault|node:internal/|Cannot read propert|Cannot access |is not a function|is not defined' "${_doctor_err}"; then
            # Exit 1 with no loader-crash signature on stderr: this is
            # the documented business failure (missing creds). The
            # smoke goal (loader works) is satisfied.
            echo "SEA loader OK (doctor exit=1 is the expected missing-creds path)"
            rm -f "${_doctor_err}"
          else
            # Either a non-1 exit code, or exit 1 accompanied by a
            # loader-fault signature on stderr. Either way, the
            # loader-side guarantee is broken.
            echo "::error::SEA loader crash on doctor (exit=${_doctor_status})"
            cat "${_doctor_err}" >&2 || true
            release/umactually-linux-x64 doctor || true
            rm -f "${_doctor_err}"
            exit "${_doctor_status}"
          fi

  # ---------------------------------------------------------------------
  # Windows variant of smoke-sea. Mirrors the linux-x64 check above
  # but runs on windows-latest, builds the Windows SEA binaries, and
  # exercises the windows-x64 .exe with --version + doctor.
  #
  # Why this exists: the v0.6.0/v0.6.1/v0.6.2/v0.6.3 Windows binaries
  # all produced empty `--version` output on real Windows despite
  # passing every other CI check (lint, types, full unit suite, the
  # Linux smoke-sea, the dry-run). The unit suite mocks
  # `fs.writeFileSync` via `vi.doMock("node:fs", ...)`, so it never
  # exercises a real Node-SEA pipe-drain path. The Linux smoke-sea
  # builds the Windows .exe but only runs the linux-x64 binary (Wine
  # isn't available on the runner). Net result: a Windows-only
  # regression lands on main and ships in a release. This job is the
  # only CI gate that runs the actual Windows binary on a real
  # Windows runner BEFORE merge.
  # ---------------------------------------------------------------------
  smoke-sea-windows:
    name: smoke-sea (windows x64)
    runs-on: windows-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Build all 5 SEA binaries
        # Same comment as the linux-x64 job: tsdown's --exe mode has
        # no per-target flag, so the config-driven build always
        # produces all 5 binaries (linux x64/arm64, darwin arm64,
        # windows x64/arm64). The smoke step below only executes the
        # windows-x64 .exe, but the other 4 are built as a side
        # effect — they get uploaded as workflow artifacts and
        # discarded. Per-target filtering is tracked in a follow-up.
        run: node scripts/build-sea.mjs windows-x64

      - name: Smoke test the Windows SEA binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $binary = "release\umactually-windows-x64.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "::error::SEA binary not built at $binary"
            exit 1
          }

          # --version is the first code path the SEA loader runs
          # after init (it fires before any subcommand dispatch).
          # Capture its exit status + stderr under a separate file
          # so a loader regression that crashes the binary on
          # --version is detected even if the doctor subcommand
          # below happens to mask the crash.
          #
          # Windows-specific note: the v0.6.0+ fix uses
          # `fs.writeFileSync(process.stdout.fd, stdout)` to avoid
          # the stream-buffer teardown race. On Windows, this write
          # is what gets routed through the parent PowerShell's
          # pipeline capture. The smoke check MUST run the binary
          # in a real subprocess (Start-Process) and capture its
          # stdout via RedirectStandardOutput, which is the same
          # pipe the installer uses.
          $versionErr = New-TemporaryFile
          $versionOut = New-TemporaryFile
          try {
            $versionProc = Start-Process -FilePath $binary `
              -ArgumentList "--version" `
              -NoNewWindow -Wait -PassThru `
              -RedirectStandardError $versionErr.FullName `
              -RedirectStandardOutput $versionOut.FullName
            $versionStatus = $versionProc.ExitCode
          } catch {
            $versionStatus = -1
            $_ | Out-String | Out-File -FilePath $versionErr.FullName -Append
          }

          if ($versionStatus -ne 0) {
            Write-Error "::error::SEA loader crash on --version (exit=$versionStatus)"
            Get-Content $versionErr.FullName -ErrorAction SilentlyContinue | Write-Host
            exit $versionStatus
          }

          $versionText = Get-Content $versionOut.FullName -Raw -ErrorAction SilentlyContinue
          if ($versionText -eq $null) {
            # Get-Content -Raw on a missing file returns $null (not "")
            # in PowerShell; .Length would NRE. Normalize first.
            $versionText = ""
          }
          if ([string]::IsNullOrWhiteSpace($versionText)) {
            Write-Error "::error::SEA --version produced empty stdout (Windows pipe-drain regression)"
            Write-Host "exit code: $versionStatus"
            Write-Host "stdout (length: $($versionText.Length)):"
            Write-Host "[empty]"
            Write-Host "stderr:"
            Get-Content $versionErr.FullName -ErrorAction SilentlyContinue | Write-Host
            exit 1
          }

          # Anchor the loader-fault regex to the start of a JS-level
          # stack-trace line. Same pattern set as the linux-x64 job.
          $errText = Get-Content $versionErr.FullName -Raw -ErrorAction SilentlyContinue
          $loaderFaultPattern = '^\s*(Error|TypeError|SyntaxError|ReferenceError|RangeError): |bad SEA|loader fault|node:internal/'
          if ($errText -and ($errText -match $loaderFaultPattern)) {
            Write-Error "::error::SEA loader crash on --version (loader-fault signature on stderr)"
            Write-Host $errText
            exit 1
          }

          Write-Host "SEA loader OK on Windows --version output: $versionText"

          # Doctor: same exit-code contract as the linux-x64 job.
          # Expects exit 0 or 1 (missing-creds); treats any other exit
          # code or a loader-fault signature as a crash.
          $doctorErr = New-TemporaryFile
          $doctorOut = New-TemporaryFile
          try {
            $doctorProc = Start-Process -FilePath $binary `
              -ArgumentList "doctor" `
              -NoNewWindow -Wait -PassThru `
              -RedirectStandardError $doctorErr.FullName `
              -RedirectStandardOutput $doctorOut.FullName
            $doctorStatus = $doctorProc.ExitCode
          } catch {
            $doctorStatus = -1
            $_ | Out-String | Out-File -FilePath $doctorErr.FullName -Append
          }

          $doctorErrText = Get-Content $doctorErr.FullName -Raw -ErrorAction SilentlyContinue
          $doctorLoaderFault = $doctorErrText -and ($doctorErrText -match $loaderFaultPattern)

          if ($doctorStatus -eq 0) {
            Write-Host "SEA loader OK (doctor exit=0, all checks passed)"
          } elseif ($doctorStatus -eq 1 -and -not $doctorLoaderFault) {
            Write-Host "SEA loader OK (doctor exit=1 is the expected missing-creds path)"
          } else {
            Write-Error "::error::SEA loader crash on doctor (exit=$doctorStatus)"
            if ($doctorErrText) { Write-Host $doctorErrText }
            # Re-invoke doctor with output captured so the failure log
            # shows the actual crash trace, not a hidden "Out-Null"
            # # that swallows everything we wanted to demonstrate.
            Write-Host "--- crash repro: $binary doctor ---"
            & $binary doctor
            Write-Host "--- end crash repro ---"
            exit $doctorStatus
          }

  # Comprehensive Windows + PowerShell coverage for every PR. Until
  # v0.6.0 this only ran on tag pushes (release.yml's
  # smoke-windows-x64 + smoke-windows-arm64-structural +
  # smoke-windows-x64-git-bash-delegate), so install.ps1 regressions
  # could land on main unnoticed. v0.6.0 promotes it to a PR gate.
  #
  # The job runs the full unit suite on windows-latest so the install
  # tests (test/unit/install-*.test.ts, including install-smart-router
  # which exercises install.ps1's smart-router via real PowerShell)
  # plus the rest of the test surface are exercised on real Windows
  # before merge. Windows PowerShell 5.1 is the default shell on
  # windows-latest; pwsh is also pre-installed for the
  # install-smart-router test (which spawns pwsh via spawnSync).
  ci-windows:
    name: ci (windows + PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Run the install suite (install-smart-router, install-archives-powershell,
      # install-scripts-powershell, install-methods, install-checksum, etc.)
      # PLUS the structural / contract tests that the release pipeline trusts
      # but the PR lane didn't. This is the core PowerShell coverage; the
      # release.yml smoke jobs (smoke-windows-x64, smoke-windows-arm64-structural)
      # are still required to verify the actual binary on real Windows runners.
      #
      # The vitest invocation uses a glob (`test/unit/install-*.test.ts`)
      # so a new install test added in test/unit/install-*.test.ts is
      # picked up automatically. An earlier revision passed an
      # explicit list, which is a drift trap: vitest 4.x does not
      # auto-pick up new files when given an explicit `run
      # <file...>`, so a new install test added in a PR that
      # didn't also edit this list would silently NOT run on
      # Windows. The glob keeps the curated-list and the actual
      # test run in sync. The non-install test files (e.g.
      # build-sea, release-targets) still run on Linux/macOS via
      # `npm test` in the main `ci` job, which uses a broader
      # glob in the package.json test script.
      - name: Run install + PowerShell unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # vitest 4.x removed the "basic" built-in reporter; passing
          # `--reporter=basic` is now interpreted as "load a custom
          # reporter module named 'basic'" and fails with
          # "Failed to load custom Reporter from basic". Use the
          # default reporter (TTY-aware: "default" in non-TTY CI,
          # "verbose" in TTY local runs) which is what `npm test`
          # already uses in the main `ci` job on Linux/macOS.
          npx vitest run test/unit/install-*.test.ts

      # Sanity check: install.ps1 --help should run cleanly (the script's
      # own self-test under Windows PowerShell 5.1). This catches the
      # "script doesn't even parse" class of regression in PR time.
      - name: install.ps1 --help smoke (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Capture stdout AND stderr to a single string with
          # Out-String. The naive `$out = ... 2>&1` produces an
          # array (one entry per line), and `$out -notmatch '...'`
          # on an array returns an array of booleans, which `if`
          # treats as truthy as long as the array is non-empty —
          # so the negative assertion silently passed even when no
          # line matched. Out-String collapses to one string and
          # -notmatch returns a single boolean.
          $out = (powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -h 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -h exited $LASTEXITCODE" }
          if ($out -notmatch 'Usage|usage|umactually') { throw "install.ps1 -h output did not contain 'umactually': $out" }
          Write-Output "OK: install.ps1 -h returned a usage block"

      # Sanity check: pwsh on the runner can launch install.ps1 the same
      # way the unit tests do. Catches the "pwsh path differs on this
      # image" class of issue.
      - name: install.ps1 --help smoke (pwsh)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = (& pwsh -NoProfile -NonInteractive -File scripts/install.ps1 -h 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -h via pwsh exited $LASTEXITCODE" }
          if ($out -notmatch 'Usage|usage|umactually') { throw "install.ps1 -h via pwsh output did not contain 'umactually': $out" }
          Write-Output "OK: install.ps1 -h via pwsh returned a usage block"

      # Parallel smoke for install.sh: catches the "script doesn't even
      # parse under the runner's bash" class of regression in PR time.
      # Mirrors the install.ps1 -h smoke above so both installers get
      # the same gate; without this the POSIX path silently rots.
      - name: install.sh --help smoke (bash)
        shell: bash
        run: |
          set -euo pipefail
          _out="$(bash scripts/install.sh --help 2>&1)"
          _status=$?
          if [ "${_status}" -ne 0 ]; then
            echo "::error::install.sh --help exited ${_status}" >&2
            echo "${_out}" >&2
            exit "${_status}"
          fi
          if ! grep -Eq 'Usage|umactually' <<<"${_out}"; then
            echo "::error::install.sh --help output did not contain 'Usage' or 'umactually':" >&2
            echo "${_out}" >&2
            exit 1
          fi
          echo "OK: install.sh --help returned a usage block"

  # ---------------------------------------------------------------------
  # PR-time end-to-end check: run the locally-built SEA binary
  # against the same hermetic mock LLM that the post-release-e2e
  # workflow uses, in BOTH provider modes (openai-compatible +
  # anthropic), and assert that each one produces >=2 inline
  # comments against the canary fixture diff.
  #
  # Why this exists: the v0.6.1+ post-release failures all
  # surfaced a wire-format regression that landed on main and
  # shipped in a release. The unit suite + dry-run + install
  # smokes + smoke-sea jobs all passed. The post-release e2e
  # only ran on `release.published`, so the regression was
  # detected AFTER the broken binary was already public. This
  # job is the same e2e harness (`test/post-release/run-e2e.mjs`
  # with `--binary-path <local>`) running on every PR so a
  # wire-format regression is caught at merge time, not release
  # time. The harness reuses the same mock LLM
  # (`test/post-release/mock-llm-server.mjs`) and the same
  # canary fixture (`test/fixtures/e2e-canary-diff.patch`) as
  # the post-release job — same expectations on both lanes.
  # ---------------------------------------------------------------------
  e2e-pr:
    name: e2e (PR-time, linux x64)
    runs-on: ubuntu-latest
    needs: smoke-sea
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Build all SEA binaries (only linux-x64 is exercised here)
        # The PR-time e2e only tests the linux-x64 binary (the
        # other 4 targets get coverage from the per-OS smoke-sea
        # jobs in this file + the release workflow). Building
        # all 5 is a side effect of the config-driven tsdown
        # build; per-target filtering is tracked in a follow-up.
        run: node scripts/build-sea.mjs linux-x64

      - name: Run post-release e2e against the local binary
        # The harness is the same one used by
        # `.github/workflows/post-release-e2e.yml` on `release.
        # published`. --binary-path points it at the local
        # build (skipping the download + checksum-verify steps)
        # so PRs without a published release can still run the
        # full wire-format check. The exit-code contract is
        # 0 = all checks passed (≥2 comments per provider); the
        # job fails on any other code.
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/e2e-pr
          PR_NUMBER: ${{ github.event.pull_request.number || '9999' }}
        run: |
          set -euo pipefail
          chmod +x release/umactually-linux-x64
          node test/post-release/run-e2e.mjs --binary-path release/umactually-linux-x64

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-linux-x64
          path: ${{ runner.temp }}/e2e-pr/
          if-no-files-found: warn
          retention-days: 7

  release-pipeline-dry-run:
    name: release pipeline dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 25.7.0 is required for `node --build-sea` (added in Node
      # 25.5.0, used by tsdown's --exe pipeline). Matches release.yml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Python3 is required by the smoke jobs' http.server fixture in
      # the actual release workflow; not strictly needed for our
      # Node-based fixture, but kept for parity so a future refactor
      # can switch back to python3 without re-validating here.
      - name: Install Python (for parity with release.yml)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "python3 already present: $(python3 --version)"
          else
            sudo apt-get update
            sudo apt-get install -y python3
          fi

      - name: Run release pipeline dry-run
        run: bash scripts/ci-release-pipeline-dry-run.sh

      - name: Upload dry-run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-pipeline-dry-run-failure
          path: |
            scripts/ci-release-pipeline-dry-run.sh
