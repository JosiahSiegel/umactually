name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-progress CI runs on the same PR to avoid wasted minutes when
# a new commit lands on a PR before the previous run finishes. Runs on
# refs/heads/main get their own concurrency group ('ci-main') with
# cancel-in-progress disabled so post-merge CI failures are never
# silently cancelled — fast-forward merge series must surface.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || 'ci-main' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Restore the npm cache that the original --cache flag used to
          # provide (the previous override hardcoded a Windows-specific
          # path under a personal user dir and broke for any other runner).
          # actions/setup-node manages the cache location automatically
          # keyed on package-lock.json.
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Bundle
        run: npm run bundle

      - name: Dist freshness guard
        run: npm run check:dist-freshness

      # Local pre-merge check that mirrors the GitGuardian GitHub App's
      # secret scan. Catches new synthetic test API keys that lack a
      # SHA256 entry in .gitguardian.yaml before the GitGuardian App
      # flags them on the next PR. Exit 0 = all literals covered.
      - name: GitGuardian coverage check
        run: node scripts/verify-gitguardian-coverage.mjs

      # CLI smoke scenarios — each step invokes scripts/ci-smoke.mjs with a
      # scenario id. Adding a new scenario = one entry in the SCENARIOS table
      # inside scripts/ci-smoke.mjs + one thin step here.
      - name: CLI smoke (S1 GitHub dry-run)
        run: node scripts/ci-smoke.mjs S1

      - name: CLI smoke (S4 Azure dry-run)
        run: node scripts/ci-smoke.mjs S4

      - name: CLI smoke (S5 redaction)
        run: node scripts/ci-smoke.mjs S5

      - name: CLI smoke (S6 SonarQube mocked)
        run: node scripts/ci-smoke.mjs S6

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-artifacts
          path: artifacts/manual/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # release-pipeline-dry-run
  # ---------------------------------------------------------------------
  # Runs the same Linux-side production release pipeline locally on every
  # PR so a green merge really does guarantee the release will succeed.
  # Bridges the gap that the regular `ci` job alone cannot close: it
  # executes
  #   - the production build (npm run build, build-sea.mjs,
  #     package-release-assets.mjs, verify-release-assets.mjs) and
  #   - the canary-equivalent Linux x64 install against a fixture that
  #     masquerades as the GitHub Releases host (so URL routing matches
  #     the immutable /releases/download/<tag>/<file> shape).
  # Bails on any failure. macOS / Windows / publish-jobs in the actual
  # release workflow are not exercised here (those runners live on
  # release-only lanes); they are gated by the
  # release-workflow-contract.test.ts structural tests. This job's goal
  # is to fail-fast on the Linux lane where most regressions live.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Smoke-test the Node SEA single-file binary on Linux. This is the
  # build target that catches the most regressions for the binary
  # distribution path. macOS / Windows SEA smoke tests live on the
  # release workflow's per-target jobs
  # (smoke-darwin-x64, smoke-darwin-arm64, smoke-windows-x64,
  # smoke-windows-arm64-structural in .github/workflows/release.yml);
  # this is a fast Linux-only gate for the daily PR lane.
  # ---------------------------------------------------------------------
  smoke-sea:
    name: smoke-sea (linux x64)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile Node SEA binary (linux-x64 only)
        run: node scripts/build-sea.mjs linux-x64

      - name: Smoke test the SEA binary
        run: |
          set -euo pipefail
          chmod +x release/umactually-linux-x64
          release/umactually-linux-x64 --version
          # Doctor runs the safety checks (env, deps, network). We expect
          # it to fail (no GitHub token, no LLM key) but not crash on
          # launch — the SEA loader must succeed. Split the two checks
          # so a `doctor` crash (exit != 0 from a loader fault) is
          # reported separately from a `doctor` business-logic failure
          # (exit != 0 from missing creds, which is expected in CI).
          set +e
          release/umactually-linux-x64 doctor >/dev/null 2>&1
          _doctor_status=$?
          set -e
          if [ "$_doctor_status" -gt 1 ]; then
            # Exit codes > 1 indicate a loader/process fault, NOT the
            # expected "missing credentials" (exit 1) business failure.
            echo "::error::SEA loader crash on doctor (exit=$_doctor_status)"
            release/umactually-linux-x64 doctor || true
            exit "$_doctor_status"
          fi
          echo "SEA loader OK (doctor exit=$_doctor_status is the expected missing-creds path)"

  # Comprehensive Windows + PowerShell coverage for every PR. Until
  # v0.6.0 this only ran on tag pushes (release.yml's
  # smoke-windows-x64 + smoke-windows-arm64-structural +
  # smoke-windows-x64-git-bash-delegate), so install.ps1 regressions
  # could land on main unnoticed. v0.6.0 promotes it to a PR gate.
  #
  # The job runs the full unit suite on windows-latest so the install
  # tests (test/unit/install-*.test.ts, including install-smart-router
  # which exercises install.ps1's smart-router via real PowerShell)
  # plus the rest of the test surface are exercised on real Windows
  # before merge. Windows PowerShell 5.1 is the default shell on
  # windows-latest; pwsh is also pre-installed for the
  # install-smart-router test (which spawns pwsh via spawnSync).
  ci-windows:
    name: ci (windows + PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Run the install suite (install-smart-router, install-archives-powershell,
      # install-scripts-powershell, install-methods, install-checksum, etc.)
      # PLUS the structural / contract tests that the release pipeline trusts
      # but the PR lane didn't. This is the core PowerShell coverage; the
      # release.yml smoke jobs (smoke-windows-x64, smoke-windows-arm64-structural)
      # are still required to verify the actual binary on real Windows runners.
      - name: Run install + PowerShell unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # vitest 4.x removed the "basic" built-in reporter; passing
          # `--reporter=basic` is now interpreted as "load a custom
          # reporter module named 'basic'" and fails with
          # "Failed to load custom Reporter from basic". Use the
          # default reporter (TTY-aware: "default" in non-TTY CI,
          # "verbose" in TTY local runs) which is what `npm test`
          # already uses in the main `ci` job on Linux/macOS.
          npx vitest run `
            test/unit/install-smart-router.test.ts `
            test/unit/install-archives-powershell.test.ts `
            test/unit/install-scripts-powershell.test.ts `
            test/unit/install-methods.test.ts `
            test/unit/install-checksum.test.ts `
            test/unit/install-archives-posix.test.ts `
            test/unit/install-scripts-posix.test.ts

      # Sanity check: install.ps1 --help should run cleanly (the script's
      # own self-test under Windows PowerShell 5.1). This catches the
      # "script doesn't even parse" class of regression in PR time.
      - name: install.ps1 --help smoke (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Capture stdout AND stderr to a single string with
          # Out-String. The naive `$out = ... 2>&1` produces an
          # array (one entry per line), and `$out -notmatch '...'`
          # on an array returns an array of booleans, which `if`
          # treats as truthy as long as the array is non-empty —
          # so the negative assertion silently passed even when no
          # line matched. Out-String collapses to one string and
          # -notmatch returns a single boolean.
          $out = (powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -h 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -h exited $LASTEXITCODE" }
          if ($out -notmatch 'Usage|usage|umactually') { throw "install.ps1 -h output did not contain 'umactually': $out" }
          Write-Output "OK: install.ps1 -h returned a usage block"

      # Sanity check: pwsh on the runner can launch install.ps1 the same
      # way the unit tests do. Catches the "pwsh path differs on this
      # image" class of issue.
      - name: install.ps1 --help smoke (pwsh)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = (& pwsh -NoProfile -NonInteractive -File scripts/install.ps1 -h 2>&1) | Out-String
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -h via pwsh exited $LASTEXITCODE" }
          if ($out -notmatch 'Usage|usage|umactually') { throw "install.ps1 -h via pwsh output did not contain 'umactually': $out" }
          Write-Output "OK: install.ps1 -h via pwsh returned a usage block"

  release-pipeline-dry-run:
    name: release pipeline dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 25.7.0 is required for `node --build-sea` (added in Node
      # 25.5.0, used by tsdown's --exe pipeline). Matches release.yml.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Python3 is required by the smoke jobs' http.server fixture in
      # the actual release workflow; not strictly needed for our
      # Node-based fixture, but kept for parity so a future refactor
      # can switch back to python3 without re-validating here.
      - name: Install Python (for parity with release.yml)
        run: |
          if command -v python3 >/dev/null 2>&1; then
            echo "python3 already present: $(python3 --version)"
          else
            sudo apt-get update
            sudo apt-get install -y python3
          fi

      - name: Run release pipeline dry-run
        run: bash scripts/ci-release-pipeline-dry-run.sh

      - name: Upload dry-run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-pipeline-dry-run-failure
          path: |
            scripts/ci-release-pipeline-dry-run.sh
            build.log
          if-no-files-found: ignore