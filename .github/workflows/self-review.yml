name: UmActually Self Review

# Runs the checked-out UmActually CLI against pull requests opened on this
# repository. Do NOT switch this workflow to pull_request_target: doing so
# would execute PR head-branch code with write permissions and could expose
# secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Cancel in-progress self-review runs on the same PR so rapid pushes do not
# spawn concurrent review runs that compete for the same PR comments slot
# (and waste API quota on the provider side).
# Concurrency key includes the head SHA so a single push can never spawn
# multiple parallel runs (e.g. when GitHub fires `synchronize` + `opened`
# + `ready_for_review` events for the same SHA within seconds — without
# the SHA key, all three land in the same concurrency group but the
# cancellation lag lets them POST reviews in parallel, leaving orphan
# empty `COMMENTED` reviews that accumulate per SHA).
# The expression falls back to github.ref when github.event.pull_request.number
# is undefined (e.g. on workflow_dispatch runs), so manual runs do not all
# collapse into a single global cancellation group.
concurrency:
  group: self-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# Workflow-level env: single source of truth for the platform so the
# upstream 'Run UmActually self review' step and the downstream
# 'Append resolution-guide' step always agree. flip here once to
# repoint both steps; do NOT inline the value into individual step env
# blocks (drift risk — see PR #139 round 8 finding 'configuration-drift').
env:
  UMACTUALLY_PLATFORM: github

jobs:
  self-review:
    name: self-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild bundled CLI
        run: npm run build

      - name: Check bundled dist is fresh
        run: npm run check:dist-freshness

      - name: Wait for SonarCloud scan + comment-surface to finish on this PR's head SHA
        # Without this wait, the umactually self-review can post its
        # review BEFORE SonarCloud's `Surface SonarCloud findings as
        # PR comments` step (a sibling of `sonarqube-scan` in ci.yml)
        # has posted its inline comments. A reviewer scanning the PR
        # timeline sees the umactually card land first with
        # "0 inline findings — ship it", then sees the SonarCloud
        # MAJOR/CRITICAL inline threads appear later — and reasonably
        # concludes the bot missed the SonarCloud finding. The two
        # workflows run in parallel on the same pull_request event;
        # this step polls the head SHA's check_runs for the
        # `SonarCloud Code Analysis` job to reach `completed` (which
        # subsumes the inline-comment surface step that runs inside
        # that job) before we proceed.
        #
        # We poll the GitHub Checks API (REST /repos/:owner/:repo/
        # commits/<sha>/check-runs) rather than workflow_run because
        # workflow_run only fires on default-branch workflows and is
        # not a reliable signal for pull_request-triggered jobs.
        #
        # Timeout is 8 minutes (32 polls × 15s). SonarCloud's own
        # `Surface SonarCloud findings as PR comments` step runs as
        # the last step of the job, so a non-zero timeout means the
        # SonarCloud job either errored or is taking unusually long.
        # Self-review is advisory: we do NOT block the job — we log a
        # warning and continue. PRs whose merge depends on SonarCloud
        # are already gated by the `SonarCloud Code Analysis` check
        # itself, which is a required status check on protected
        # branches. The wait here exists to make the umactually review
        # body coherent with the inline-comment timeline, not to
        # replace the quality gate.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WAIT_TIMEOUT_SECONDS: "480"
          POLL_INTERVAL_SECONDS: "15"
          SONAR_CHECK_NAME: "SonarCloud Code Analysis"
        run: |
          set +e
          deadline=$(( $(date +%s) + WAIT_TIMEOUT_SECONDS ))
          poll_count=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            poll_count=$((poll_count + 1))
            STATUS_JSON=$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == env.SONAR_CHECK_NAME)] | .[0] // null')
            if [ "${STATUS_JSON}" = "null" ] || [ -z "${STATUS_JSON}" ]; then
              STATUS="missing"
              CONCLUSION="unknown"
            else
              STATUS=$(printf '%s' "${STATUS_JSON}" | jq -r '.status // "missing"' 2>/dev/null)
              CONCLUSION=$(printf '%s' "${STATUS_JSON}" | jq -r '.conclusion // "unknown"' 2>/dev/null)
            fi
            if [ "${STATUS}" = "completed" ]; then
              echo "SonarCloud check completed after ${poll_count} poll(s); conclusion=${CONCLUSION}. Proceeding to self-review."
              exit 0
            fi
            if [ "${STATUS}" = "missing" ] && [ "${poll_count}" -ge 2 ]; then
              # Two consecutive "missing" responses (no check named
              # `SonarCloud Code Analysis` on this SHA) means SonarCloud
              # isn't configured for this PR — fork PRs without
              # SONAR_TOKEN skip the sonarqube-scan job entirely. Bail
              # out of the wait and proceed.
              echo "SonarCloud check absent on SHA ${HEAD_SHA} (likely a fork without SONAR_TOKEN). Proceeding without waiting."
              exit 0
            fi
            echo "SonarCloud check status='${STATUS}' (poll ${poll_count}); sleeping ${POLL_INTERVAL_SECONDS}s."
            sleep "${POLL_INTERVAL_SECONDS}"
          done
          echo "::warning::SonarCloud check did not complete within ${WAIT_TIMEOUT_SECONDS}s on SHA ${HEAD_SHA}. Proceeding with self-review anyway; the bot review may land before SonarCloud's inline-comment surface step finishes."
          exit 0

      - name: Run UmActually self review
        # Self-review is an advisory signal: a provider-side timeout
        # (e.g. Anthropic rate-limit) should NOT block the PR from
        # merging. The hard requirements live in ci.yml: typecheck +
        # test + bundle gate the PR merge. We therefore always exit 0
        # at the shell level and rely on a follow-up step to surface
        # failures via a step summary + ::warning:: annotation, so
        # the failure is visible in the PR's checks view without
        # turning the overall job red.
        #
        # --per-request-timeout-seconds 240 raises the default 60s
        # timeout (live-provider.ts DEFAULT_REQUEST_TIMEOUT_MS) to 4
        # minutes, which is enough for a 32K-token Anthropic response
        # on a typical PR. The flag is parsed by `bin/umactually.mjs`
        # via parse-args; if the flag is removed from the workflow
        # but kept in the binary, the binary will error with
        # "unknown flag: --per-request-timeout-seconds" and the
        # review will fail. The reverse (flag kept here, removed
        # from the binary) will also fail in the same way. The two
        # must be updated together.
        #
        # The --platform flag below is the source of truth for which
        # platform's resolution guide the post-step appends. The
        # corresponding env var UMACTUALLY_PLATFORM is read by the
        # 'Append resolution-guide' step further down to pick the
        # matching guide file. If --platform changes, that env var
        # must change in lockstep — otherwise the appended guide
        # references commands (\$GH api graphql vs az repos pr thread
        # update) that don't apply to the actual review platform.
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UMACTUALLY_API_URL: ${{ secrets.UMACTUALLY_API_URL }}
          UMACTUALLY_API_KEY: ${{ secrets.UMACTUALLY_API_KEY }}
          # UMACTUALLY_PLATFORM is inherited from the workflow-level env
          # (single source of truth — see comment above 'jobs:').
        run: |
          # set +e keeps the script running even if `node` is missing or
          # the binary errors out. We capture the exit code into a
          # variable, write it to GITHUB_OUTPUT, and ALWAYS reach
          # `exit 0` at the end (last line, with `|| true` on the echo
          # to defend against $GITHUB_OUTPUT being unwritable).
          set +e
          REVIEW_EXIT=0
          node bin/umactually.mjs review \
            --platform "${UMACTUALLY_PLATFORM}" \
            --no-detect-leaks \
            --debug-raw-response \
            --max-output-tokens 32000 \
            --per-request-timeout-seconds 240 \
            --include-pr-sonar-findings
          REVIEW_EXIT=$?
          echo "review-exit=${REVIEW_EXIT}" >> "${GITHUB_OUTPUT:-/dev/null}" || true
          echo "platform=${UMACTUALLY_PLATFORM}" >> "${GITHUB_OUTPUT:-/dev/null}" || true
          exit 0

      - name: Append resolution-guide to latest review body
        if: github.event_name == 'pull_request'
        env:
          # `gh` reads GITHUB_TOKEN (not GH_TOKEN) as the primary auth
          # env var; GH_TOKEN is a fallback. Match the upstream
          # 'Run UmActually self review' step's auth posture so a
          # pull_request from a fork doesn't fall back to ambient auth.
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Honor the upstream step's --platform flag (echoed via step
          # output). workflow_dispatch runs without the upstream step
          # fall back to github (this workflow only runs on
          # github.com-hosted runners).
          UMACTUALLY_PLATFORM: ${{ steps.review.outputs.platform || env.UMACTUALLY_PLATFORM }}
        run: |
          # Append the platform-specific resolution guide to the umactually
          # self-review on the CURRENT head commit. The guide is the
          # agent-facing handbook for reading AND resolving umactually
          # reviews (GraphQL close protocol, disposition taxonomy,
          # verdict interpretation) — it applies to EVERY review, not
          # only finding-bearing ones. An agent reading a clean
          # 0-finding review still needs the protocol to formally close
          # the review (Step 1 disposition "ship it" / "no findings").
          # Idempotency: the marker-based skip below prevents duplicate
          # appends on reruns; the inlineCount=0 skip was removed because
          # a clean review IS a review.
          # All API calls go through GraphQL rather than the REST `/reviews`
          # endpoint to side-step three classes of fragility:
          #   1. REST `/reviews?per_page=30` is unbounded for very long PRs;
          #      GraphQL `reviews(last: N)` is a clean cap on a single round
          #      trip (we use last:1 to fetch only the newest review).
          #   2. REST PUT to `/reviews/{id}` only works for PENDING reviews
          #      (server-side validated by GitHub); once the bot submits its
          #      review (with any of the events `COMMENT`, `APPROVE`,
          #      `REQUEST_CHANGES`), state moves out of PENDING to one of
          #      `COMMENTED` / `APPROVED` / `CHANGES_REQUESTED`. The PUT
          #      body update is allowed for any non-PENDING state, so we
          #      filter `state != PENDING` here rather than pinning to one
          #      specific state. The skip-log message echoes the actual
          #      state so a future schema drift is visible in the run log.
          #   3. The "newest bot review" selection by database-id is fragile
          #      if other bot actors (Dependabot, step-summary bots) post
          #      comments; filtering by `commit.oid == HEAD_SHA` plus
          #      `author.login == github-actions` is unambiguous.
          # The platform env var above auto-detects the target platform; the
          # upstream CLI step may use --platform auto or --platform github
          # directly, but the env var tracks the actual CI environment, so
          # an Azure DevOps run gets the Azure guide and a GitHub PR gets
          # the GitHub guide without the two values drifting apart.
          # Scope `set +e` to the read-only GraphQL fetch only. The
          # upstream 'Run UmActually self review' step ran with
          # `set +e` to mask transient API failures (it is advisory and
          # never blocks the CI job). This step inherits that mask, so
          # we scope our own +e to the fetch and restore `-e` before
          # any destructive write so a partial PUT failure does not
          # silently leave the body in an unknown state.
          set +e
          # UMACTUALLY_PLATFORM is sourced from the upstream step's
          # --platform flag (echoed as a step-output) and passed in via
          # this step's env block. Validate the value before using it
          # to construct a file path; any unexpected value is a config
          # error and we exit 0 (advisory step, never blocks CI).
          if [ "${UMACTUALLY_PLATFORM}" != "github" ] && [ "${UMACTUALLY_PLATFORM}" != "azure" ]; then
            echo "Unsupported UMACTUALLY_PLATFORM='${UMACTUALLY_PLATFORM}'; expected github or azure. Skipping."
            exit 0
          fi
          GUIDE_FILE="${{ github.workspace }}/.github/workflows/data/resolution-guide-${UMACTUALLY_PLATFORM}.md"
          if [ ! -f "${GUIDE_FILE}" ]; then
            echo "Guide file not found at ${GUIDE_FILE}; skipping."
            exit 0
          fi
          GUIDE_MARKER="<!-- umactually:resolution-guide-v1 -->"
          QUERY_FILE="${{ github.workspace }}/.github/workflows/data/latest-bot-review.graphql"
          # Pull the latest non-PENDING github-actions review on the
          # current head. The query is parameterized; only the GraphQL
          # variables carry possibly-untrusted values.
          REVIEW_JSON=$(gh api graphql \
            -F owner="${GITHUB_REPOSITORY%/*}" \
            -F name="${GITHUB_REPOSITORY#*/}" \
            -F pr="${PR_NUMBER}" \
            -F query="$(cat "${QUERY_FILE}")")
          # Validate the GraphQL response shape. A `.errors` array
          # (rate-limit, auth failure, schema drift) leaves `.data`
          # null; without this check the next `jq` calls would emit
          # null/empty and the step would skip with a misleading
          # "No github-actions review" message.
          if ! printf '%s' "${REVIEW_JSON}" | jq -e '.data.repository.pullRequest.reviews.nodes' >/dev/null 2>&1; then
            echo "GraphQL response missing .data.repository.pullRequest.reviews.nodes; treating as transient and skipping."
            printf '%s' "${REVIEW_JSON}" | jq -r '.errors // "no errors field"' 2>/dev/null | head -5
            exit 0
          fi
          # Restore -e now that the read-only fetch is done.
          set -e
          REVIEW_ROW=$(printf '%s' "${REVIEW_JSON}" | jq -r --arg sha "${HEAD_SHA}" \
            '[(.data.repository.pullRequest.reviews.nodes // [])[] | select(.author.login == "github-actions" and .commit.oid == $sha)] | sort_by(.databaseId) | reverse | .[0] // empty')
          if [ -z "${REVIEW_ROW}" ] || [ "${REVIEW_ROW}" = "null" ]; then
            echo "No github-actions[bot] review on PR ${PR_NUMBER} at HEAD ${HEAD_SHA}; skipping."
            exit 0
          fi
          # Pull fields out of the picked row.
          REVIEW_ID=$(printf '%s' "${REVIEW_ROW}" | jq -r '.databaseId')
          REVIEW_STATE=$(printf '%s' "${REVIEW_ROW}" | jq -r '.state')
          if [ "${REVIEW_STATE}" = "PENDING" ]; then
            echo "Latest bot review ${REVIEW_ID} is still PENDING (unsubmitted); PUT-to-body would 422. Skipping."
            exit 0
          fi
          CURRENT=$(printf '%s' "${REVIEW_ROW}" | jq -r '.body // ""')
          # Extract inlineCount from the umactually manifest JSON blob. The
          # bot terminates its review body with a single-line comment of the
          # form <!-- umactually:manifest {"schema":"umactually/v1",...,
          # "inlineCount":N, ...} -->. Pluck the field directly from the
          # structured marker; never parse free-form summary text.
          HAS_MARKER=$(printf '%s' "${CURRENT}" | grep -c '<!-- umactually:manifest ')
          if [ "${HAS_MARKER}" -eq 0 ]; then
            echo "Review ${REVIEW_ID} (state=${REVIEW_STATE}) has no umactually:manifest marker; manifest schema drift suspected. Skipping guide append (safer than guessing inlineCount=0)."
            exit 0
          fi
          # Extract inlineCount from the umactually:manifest JSON blob. The
          # bot terminates its review body with a single-line comment
          # of the form <!-- umactually:manifest {"schema":"umactually/v1",...,
          # "inlineCount":N, ...} -->. Pipe through `tac` first so the
          # LAST occurrence (the real manifest) is processed before any
          # earlier occurrence (which can appear inside the review
          # summary text if the bot happens to quote the marker shape).
          # `tac` reverses line order; awk picks the first match it sees
          # in the reversed stream, which is the LAST occurrence of the
          # marker in the original.
          MANIFEST_JSON=$(printf '%s' "${CURRENT}" | tac | awk '
            /<!-- umactually:manifest / {
              sub(/^.*<!-- umactually:manifest /, "")
              print
              exit
            }
          ' | sed 's/[[:space:]]*-->$//')
          if [ -z "${MANIFEST_JSON}" ]; then
            INLINE_COUNT=0
          else
            INLINE_COUNT=$(printf '%s' "${MANIFEST_JSON}" | jq -r '.inlineCount // 0' 2>/dev/null) || INLINE_COUNT=0
            # Guard against jq emitting a non-numeric token (e.g. 'null'
            # from a missing field that didn't match the `// 0` fallback,
            # or 'true'/'false' if a future schema change lands). Without
            # this, INLINE_COUNT='null' would skip the zero-branch below
            # and the guide would append to an empty review.
            case "${INLINE_COUNT}" in
              ''|*[!0-9]*) INLINE_COUNT=0 ;;
            esac
          fi
          if [ "${INLINE_COUNT}" = "0" ]; then
            # The guide is the agent-facing handbook for reading AND
            # resolving umactually reviews, NOT a triage cheatsheet. It
            # documents the GraphQL close protocol, the disposition
            # taxonomy, and how to interpret every verdict including
            # ✅ SHIP / 💬 DISCUSS. An agent reading a clean 0-finding
            # review still needs that protocol to formally close the
            # review (Step 1 disposition "ship it" / "no findings").
            # The previous skip was wrong: a clean review IS a review,
            # and an agent following the protocol must still see the
            # protocol. Append unconditionally; the marker-based idempotency
            # check below prevents duplicate appends on reruns.
            echo "Review ${REVIEW_ID} has inlineCount=0 (per manifest); appending guide anyway — the resolution protocol is required for any review, not just finding-bearing ones."
          fi
          if printf '%s' "${CURRENT}" | grep -qF "${GUIDE_MARKER}"; then
            echo "Review ${REVIEW_ID} already contains the guide; skipping."
            exit 0
          fi
          # Build new body: original + guide + trailing marker. Use jq for
          # the join so embedded backslashes, quotes, backticks, and dollar
          # signs survive.
          GUIDE_CONTENT="$(cat "${GUIDE_FILE}")"
          NEW_BODY=$(jq -nr --arg a "${CURRENT}" --arg b "${GUIDE_CONTENT}" --arg m "${GUIDE_MARKER}" \
            '$a + "\n---\n\n" + $b + "\n" + $m + "\n"')
          # Update the review body via REST PUT. Pass the body via an
          # intermediate file to avoid shell-quoting headaches (the body
          # contains backslashes, quotes, backticks, dollar signs).
          TMPF=$(mktemp)
          trap 'rm -f "${TMPF}"' EXIT
          jq -n --arg body "${NEW_BODY}" '{body: $body}' > "${TMPF}"
          gh api \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --input "${TMPF}" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" \
            | jq '{id, body_len: (.body | length)}'
          PUT_EXIT=$?
          set -e
          if [ "${PUT_EXIT}" -ne 0 ]; then
            echo "PUT-to-review failed (exit=${PUT_EXIT}); self-review is advisory so the workflow exits 0. The next push will re-attempt."
            exit 0
          fi


      - name: Run check-review-artifact guard for suspicious signals
        # Hardening for the rubber-stamp concern surfaced after PR #141-
        # #143 returned consecutive clean self-reviews with no inline
        # findings. The guard runs `umactually check-review-artifact`
        # against the live artifact; if the artifact is well-formed but
        # the review posted in <3s with 0 findings and 0 provider round-
        # trips, the CLI emits `::warning::` annotations that GitHub
        # Actions surfaces on the PR's checks view. The step is
        # advisory: it does not fail the job. The check is structural
        # (artifact-shape based) and does not require a provider call.
        # We use `set +e` because the guard's exit code may be non-zero
        # on a parse-fail sentinel — but we still want to capture the
        # annotations emitted on stdout before the failure.
        if: always()
        run: |
          set +e
          ARTIFACT="artifacts/manual/s1-github-self-review.md"
          if [ ! -f "${ARTIFACT}" ]; then
            echo "Artifact not found at ${ARTIFACT}; check-review-artifact guard skipped."
            exit 0
          fi
          node bin/umactually.mjs check-review-artifact "${ARTIFACT}"
          # Always exit 0 — this step is advisory. Annotations already
          # emitted by the CLI on stdout become GitHub Actions warnings.
          # We intentionally do NOT export guard-exit to GITHUB_OUTPUT:
          # no downstream step references it, and `${GITHUB_OUTPUT:-/dev/null}`
          # would silently swallow the echo on self-hosted runners where
          # the env var is unset (addresses self-review inline finding
          # on PR #144 round 2).
          exit 0

      - name: Summarise self-review outcome
        if: always()
        env:
          REVIEW_EXIT: ${{ steps.review.outputs.review-exit }}
        run: |
          ARTIFACT="artifacts/manual/s1-github-self-review.md"
          {
            echo "## UmActually self-review"
            echo ""
            if [ "${REVIEW_EXIT:-0}" = "0" ]; then
              echo "✅ **Self-review completed.** The umactually CLI posted a review on this PR."
            else
              echo "⚠️ **Self-review did NOT complete** (exit \`${REVIEW_EXIT}\`)."
              echo ""
              echo "The overall job is green because self-review is advisory; a provider-side"
              echo "timeout (e.g. Anthropic rate-limit) should not block merging. Inspect the"
              echo "artifact and the step log before merging if the review matters for this PR."
              echo ""
              echo "**Failure summary:**"
              echo ""
              echo '```json'
              if [ -f "${ARTIFACT}" ]; then
                jq -c '{posted, parseFailed, message, inlineThreadCount, verdict, note, reviewDurationMs, providerRoundTrips}' "${ARTIFACT}" 2>/dev/null || cat "${ARTIFACT}"
              else
                echo '{"parseFailed": null, "reason": "artifact not found at '"${ARTIFACT}"'"}'
              fi
              echo '```'
              echo ""
              echo "::warning::Self-review failed (exit ${REVIEW_EXIT}). The PR is not blocked because self-review is advisory; review the artifact at \`${ARTIFACT}\` before merging."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

# Verifying the action posted a review
# -----------------------------------
# 1. Open the pull request that triggered this workflow.
# 2. Look for comments or review feedback containing the marker:
#        <!-- umactually -->
# 3. On the PR conversation tab, the CLI posts a single pull request review
#    with inline threads on files in the diff. On the Files changed tab the
#    inline threads are visible per file.
# 4. A workflow_dispatch run without pull request context does not post.
# 5. When the review fails (provider timeout, rate-limit, parse-failure),
#    the **Summarise self-review outcome** step writes a step summary
#    (visible in the Actions run view) and a `::warning::` annotation
#    (visible on the failed step in the Actions UI). The overall job
#    stays green because self-review is advisory and must not block
#    merging — but the failure is no longer buried in raw logs.
# 5a. The **Run check-review-artifact guard for suspicious signals** step
#    additionally runs `umactually check-review-artifact` against the
#    live artifact after the review completes. The guard classifies the
#    artifact and, for clean-shaped reviews with suspicious telemetry
#    (sub-3s duration, zero provider round-trips, rubber-stamp verdict),
#    emits one or more `::warning::` annotations. This is the hardening
#    for the rubber-stamp concern surfaced after PR #141-#143 returned
#    consecutive clean self-reviews with no inline findings. The step
#    always exits 0; the warnings are advisory and do not block the PR.
# 6. The local artifact at `artifacts/manual/s1-github-self-review.md`
#    captures {posted, parseFailed, message, inlineThreadCount, verdict,
#    note} even on failure (see src/cli/run.ts writeLiveArtifact), so
#    the step summary can show a structured failure breakdown via `jq`.
# 7. Reading + resolving the threads: see .github/SELF-REVIEW-RESOLUTION-GUIDE.md
#    for the full agent-facing recipe (triage matrix, GitHub + Azure DevOps
#    close commands, GraphQL thread resolution, common pitfalls).
#    The audit PR #139 collapsed version of this guide is posted as a PR
#    comment on every umactually review run for discoverability.
