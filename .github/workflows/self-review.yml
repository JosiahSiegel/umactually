name: UmActually Self Review

# Runs the in-tree UmActually PR review action against pull requests opened on
# this repository. This workflow consumes the action via ./, which means each
# PR is reviewed by the version of the action checked out with the PR head.
# Do NOT switch this workflow to pull_request_target: doing so would execute
# PR head-branch code with write permissions and could expose secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  self-review:
    name: self-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild bundled dist
        # The committed dist/ in the PR head may be older than src/ from
        # someone else's prior commit. The action entrypoint is dist/index.js
        # (see action.yml), so a stale bundle silently reviews with the
        # wrong code. Re-bundle every run, then verify the freshness check
        # passes before posting the review.
        run: npm run build

      - name: Check bundled dist is fresh
        run: npm run check:dist-freshness

      - name: Run UmActually self review
        uses: ./
        with:
          dry-run: 'false'
          detect-leaks: 'false'
          # Emit the extracted payload to stderr on parse-fail so the
          # GitHub Actions log shows what the parser actually saw. The
          # 16 KB diagnostic in the PR comment truncates the middle of
          # the raw response (where response.completed lives), so without
          # this log we cannot tell whether the parser extracted the
          # right text or the wrong one.
          debug-raw-response: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          UMACTUALLY_API_URL: ${{ secrets.UMACTUALLY_API_URL }}
          UMACTUALLY_API_KEY: ${{ secrets.UMACTUALLY_API_KEY }}

      # Self-review guard: refuses to pass CI when the action's output
      # artifact is a parse-fail diagnostic card instead of a real
      # review. Runs AFTER the action step (with if: always()) so it
      # inspects the current run's output, not a stale artifact from a
      # previous run. Regression context: PR #17 self-review posted
      # the same parse-fail card 4 times in a row and every CI check
      # passed because the action exit code was 0 — this guard catches
      # that regression class.
      - name: Verify self-review output is a real review
        if: always()
        run: node scripts/check-self-review-output.mjs

# Verifying the action posted a review
# -----------------------------------
# 1. Open the pull request that triggered this workflow.
# 2. Look for comments or review feedback containing the marker:
#        <!-- umactually-pr-review -->
# 3. On the PR conversation tab, the action posts a single pull request review
#    with inline threads on files in the diff. On the Files changed tab the
#    inline threads are visible per file.
# 4. If the workflow ran via workflow_dispatch, the run summary lists the
#    number of inline threads and suppressed comments for the PR whose number
#    was passed through the runtime; if no PR number is available, the run is
#    treated as a no-op by the runtime.