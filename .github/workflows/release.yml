name: Release

on:
  push:
    tags:
      - "v*"

# Each tag gets its own release; never cancel a release run because a
# follow-up tag was pushed while the previous one was still building —
# the previous release may have already uploaded partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile standalone binaries
        run: node scripts/build-binary.mjs

      - name: Smoke test (--version)
        run: ./release/umactually-linux-x64 --version

      - name: Smoke test (doctor)
        run: ./release/umactually-linux-x64 doctor

      - name: Smoke test (--help)
        run: ./release/umactually-linux-x64 --help

      - name: Compute SHA-256 checksums
        working-directory: release
        run: sha256sum umactually-* > checksums.txt

      - name: Upload Windows x64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: umactually-windows-x64
          path: release/umactually-windows-x64.exe

      - name: Upload Windows ARM64 binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: umactually-windows-arm64
          path: release/umactually-windows-arm64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/umactually-linux-x64
            release/umactually-linux-arm64
            release/umactually-darwin-x64
            release/umactually-darwin-arm64
            release/umactually-windows-x64.exe
            release/umactually-windows-arm64.exe
            release/checksums.txt

  windows-smoke:
    name: Windows binary smoke
    needs: release
    runs-on: windows-latest
    steps:
      - name: Download Windows x64 binary
        uses: actions/download-artifact@v4
        with:
          name: umactually-windows-x64
          path: .
      - name: Download Windows ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: umactually-windows-arm64
          path: .
      - name: Smoke test (x64)
        shell: pwsh
        run: .\umactually-windows-x64.exe --version
      - name: Verify ARM64 binary exists
        shell: pwsh
        run: |
          if (-not (Test-Path .\umactually-windows-arm64.exe)) {
            throw "umactually-windows-arm64.exe was not built or uploaded"
          }

  # The release job above publishes the binaries + checksums.txt, but the
  # scripts/install.sh and scripts/install.ps1 installer scripts are what
  # end users actually run to fetch + verify + install the release. These
  # jobs exercise the install scripts end-to-end against the freshly-
  # published release assets, proving the user-facing install path works.
  # If the URL shape changes, the asset rename conflicts, or the SHA-256
  # format drifts, these jobs fail loudly.
  install-smoke-linux:
    name: Install script smoke (Linux)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run install.sh against the real published release. This exercises
      # the production download + SHA-256 verify + install path end-to-end.
      # Runner is non-root by default on ubuntu-latest since 2022, so the
      # binary lands in $HOME/.local/bin/umactually.
      - name: Run install.sh (download + verify + install against ${{ github.ref_name }})
        run: bash scripts/install.sh

      - name: Verify installed binary works
        run: |
          set -euo pipefail
          # install.sh adds ~/.local/bin to PATH via shell rc; export directly
          # for this step so the invocation resolves the freshly-installed
          # binary instead of any pre-existing one on the runner image.
          export PATH="$HOME/.local/bin:$PATH"
          echo "--- --version ---"
          umactually --version
          echo "--- doctor ---"
          umactually doctor
          echo "--- --help (head) ---"
          umactually --help | head -5

  install-smoke-windows:
    name: Install script smoke (Windows)
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Run install.ps1 in INSTALL_TEST_MODE=1 against the freshly-published
      # release. The test mode redirects the install to $env:INSTALL_TEST_DIR
      # so it does not touch the runner's real user profile, and it skips
      # the network download (we already verified the SHA-256 math via the
      # unit tests + the real install on linux). What we are validating here
      # is that install.ps1 parses, exits 0, and emits the right summary on
      # the windows-latest image.
      #
      # install.ps1 auto-detects platform/arch from $env:PROCESSOR_ARCHITECTURE
      # — it does NOT consume PLATFORM_OVERRIDE/ARCH_OVERRIDE env vars (those
      # are install.sh's contract, not install.ps1's). On windows-latest the
      # auto-detected arch is x64, which is the asset shape we just published.
      - name: Run install.ps1 (test mode against ${{ github.ref_name }})
        id: install
        shell: pwsh
        env:
          INSTALL_TEST_MODE: "1"
        run: |
          $installDir = Join-Path $env:TEMP ([System.Guid]::NewGuid().Guid)
          $env:INSTALL_TEST_DIR = $installDir
          ./scripts/install.ps1
          # Publish the install dir to the workflow output so the verify
          # step (which runs in a fresh pwsh process) can find the stub
          # without relying on cross-step env propagation.
          "install-dir=$installDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify the test-mode install actually wrote a stub
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.install.outputs.install-dir }}
        run: |
          # Require INSTALL_DIR to be set — there is no safe default,
          # because in test mode the stub MUST land under the sandbox the
          # previous step chose, and silently falling back to
          # $env:USERPROFILE\.local\bin would mask a real failure.
          if (-not $env:INSTALL_DIR) {
            throw "INSTALL_DIR was not propagated from the install step; cannot verify stub path"
          }
          $stub = Join-Path $env:INSTALL_DIR "umactually.exe"
          if (-not (Test-Path $stub)) {
            throw "Expected test-mode stub at $stub but it was not written"
          }
          Write-Output "OK: stub written at $stub"
