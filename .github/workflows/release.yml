name: Release

run-name: Release verification ${{ inputs.correlation || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish flag. true = publish this ref directly (same as a tag push). false = dry-run, creates a draft for QA review. Default is false (verify-only)."
        type: boolean
        required: false
        default: false
      correlation:
        description: "QA correlation id (required for dispatch runs)."
        type: string
        required: true

# Each tag gets its own release; never cancel a release run because a
# follow-up tag was pushed while the previous one was still building —
# the previous release may have already uploaded partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: no top-level permissions. Every job declares its own.
# Only the `publish` job holds `contents: write`; everything else is
# `contents: read` / `actions: read`.
permissions: {}

jobs:
  # ---------------------------------------------------------------------
  # (a) Build/package on ubuntu-24.04. Generates the six archives,
  #     checksums.txt, and release-size-report.json, then uploads ONE
  #     immutable Actions artifact named `umactually-release-candidate`
  #     with the exact root layout:
  #       public/<six archives>           (compressed download assets)
  #       public/checksums.txt            (sha256 manifest)
  #       internal/raw/<six raw binaries> (Bun output, kept internal)
  #       internal/release-size-report.json (size telemetry, kept internal)
  #     with no other files. The upload step ID is `candidate-upload` so
  #     publish/canary can pull the artifact by its stable id via the
  #     `actions/artifacts/<id>/zip` API.
  # ---------------------------------------------------------------------
  build-package:
    name: build & package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile Node SEA standalone binaries
        run: node scripts/build-sea.mjs

      - name: Package release assets (archives + checksums)
        run: |
          mkdir -p release/public release/internal/raw
          # Packager writes into --release-dir (default) so the verifier can
          # see both archives and raws from the same root. The staging step
          # below splits the flat layout into public/ and internal/raw/.
          node scripts/package-release-assets.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release

      - name: Compute release-size report
        # v0.6.0: the Bun-version-pinned verify-release-assets.mjs is
        # gone. We replaced it with a per-target output check that
        # confirms each manifest target produced an output AND that the
        # raw binary stays under a sane per-target ceiling. tsdown's
        # --exe enforces bundle size internally; this ceiling is a
        # safety net for a runaway build (e.g. a new dep pulls in a
        # 500 MB native module). The smoke-sea job in ci.yml is the
        # runtime check.
        #   - MIN_RAW_BYTES (1 MiB): rejects an empty / truncated file
        #     that "exists but is broken" — a partial SEA blob is worse
        #     than a missing one because the installer downloads it,
        #     sha256-passes (the chunk is self-consistent), then
        #     crashes on launch.
        #   - MAX_RAW_BYTES (200 MiB): hard cap. As of v0.6.0 the
        #     largest target is darwin-arm64 at ~125 MiB. 200 MiB leaves
        #     ~50% headroom for legitimate growth (e.g. a new dep
        #     tree) and is far below the installer's pipe-buffer
        #     concerns. Any new target that legitimately needs more
        #     room must bump this number AND the docs/ release-process
        #     section that documents it.
        #
        # The step is split into two `run:` blocks so a verifier
        # non-zero exit (MISSING / TOO_SMALL / TOO_LARGE) is the last
        # command bash sees and therefore propagates as the step's
        # exit code. Previously the verifier + `test -f` lived in one
        # block; the `test -f` could mask a verifier silent-exit bug
        # (a future change to verify-release-sizes.mjs that wrote the
        # JSON but exited 0 incorrectly) and let the workflow publish
        # with a tampered report. Fail-closed: if the verifier exits
        # non-zero, the workflow stops before staging.
        run: |
          set -euo pipefail
          # MIN_RAW_BYTES (1 MiB) and MAX_RAW_BYTES (200 MiB) are owned
          # by scripts/verify-release-sizes.mjs (also called by
          # scripts/ci-release-pipeline-dry-run.sh). Both call sites
          # delegate to the same module so the thresholds and the
          # size-report JSON shape cannot drift between the release
          # build and the PR-time dry-run. Bumping the ceiling
          # requires editing one constant; the docs cross-reference
          # both call sites.
          node scripts/verify-release-sizes.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release
      - name: Lock release-size-report.json path
        # Lock the report path explicitly so a future change to the
        # verifier (e.g. a --report flag flip) doesn't silently let
        # the file land elsewhere and break the staging step. This
        # runs as a SEPARATE step from the verifier so the verifier's
        # non-zero exit (MISSING / TOO_SMALL / TOO_LARGE) propagates
        # correctly; the test does NOT mask a verifier silent-exit bug.
        run: |
          set -euo pipefail
          test -f release/internal/release-size-report.json

      - name: Stage candidate bundle (public/<archives>, public/checksums.txt, internal/raw/<binaries>, internal/release-size-report.json)
        run: |
          set -euo pipefail
          # After packager + verifier the flat `release/` root holds both
          # archives and raws. Split it into the public/internal layout via
          # the shared staging script — same script the CI dry-run uses so
          # the production build and the PR-time guarantee exercise one
          # path.
          node scripts/stage-release-assets.mjs \
            --release-dir release \
            --manifest scripts/release-targets.json
          ls -la release/public
          ls -la release/internal/raw
          test -f release/internal/release-size-report.json

      - name: Upload candidate bundle
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-release-candidate
          # This input is workspace-relative. actions/upload-artifact
          # archives the *contents* of each `path:` and strips the
          # shared `release/` ancestor — so the published ZIP has
          # entries `public/...`, `internal/...`, `internal/raw/...`
          # (no `release/` prefix). After publish unzips the candidate
          # bundle, the manifest lives at
          #   $RUNNER_TEMP/umactually-release-candidate/internal/release-targets.json
          # and the publish job's Node helpers `cd` into that bundle
          # root before reading it. The canary reads the in-repo
          # `scripts/release-targets.json` from `GITHUB_WORKSPACE`
          # instead — it does not download the artifact.
          path: |
            release/public
            release/internal/raw
            release/internal/release-size-report.json
            release/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # (b0) Windows binary fixup. The main `build-package` job runs on
  #      ubuntu-24.04 and produces ALL 5 binaries via tsdown's --exe
  #      mode. Empirically (post-release e2e runs 29952373686,
  #      29955112530, 29956733866, 29957176771), the Linux-built
  #      Windows .exe embeds a Node 25.7.0 SEA blob that produces
  #      empty `--version` output on real Windows — even though
  #      the exact same source code, built on Windows, produces a
  #      working .exe. The 1024-byte size delta between the two
  #      builds is the Node 25.7.0 SEA blob, and the difference is
  #      enough to break the post-`runVersion` pipe-drain on real
  #      Windows. PR #114 (smoke-sea windows x64 in ci.yml) catches
  #      this at PR time; this job re-builds the Windows binaries
  #      on Windows for the actual release so the published
  #      Windows .exe is the working one.
  #
  # This job:
  #   1. Downloads the ubuntu-built artifact (the "stage1" bundle).
  #   2. Re-builds the Windows binaries on windows-2025 via
  #      `scripts/build-sea.mjs` (the same script; tsdown's --exe
  #      mode is cross-platform — the only thing that differs is
  #      the host runner, which controls which Node 25.7.0 SEA
  #      blob gets embedded).
  #   3. Re-packages the Windows archives via
  #      `scripts/package-release-assets.mjs` (it produces all 5
  #      archives, but on Windows only the Windows entries are
  #      valid; the linux + darwin archives are thrown away).
  #   4. Re-stages the release tree.
  #   5. Merges the windows-built Windows entries into the stage1
  #      bundle and re-computes a single `checksums.txt` that
  #      covers all 5 final assets (windows-built Windows + the
  #      unchanged linux + darwin entries from stage1). Uploads
  #      the merged bundle as a new artifact
  #      `umactually-release-candidate` that the smoke + publish
  #      jobs then consume (in place of the stage1 bundle).
  #
  # All downstream jobs that currently `needs: build-package`
  # switch to `needs: [build-package, build-package-windows]` and
  # download the merged artifact by the new
  # `build-package-windows.outputs.merged_artifact_id` so the
  # download is keyed to the exact zip whose digest we report.
  # ---------------------------------------------------------------------
  build-package-windows:
    name: build & package (windows)
    needs: build-package
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    # Re-export the merged-upload step's outputs at the job level so
    # downstream smoke + publish jobs can reference them via
    # `needs.build-package-windows.outputs.merged_artifact_id` /
    # `outputs.merged_artifact_digest` — the standard job-output
    # pattern (GitHub Actions doesn't allow direct
    # `needs.<job_id>.outputs.<step_id>.<output_name>` references
    # across jobs without the `outputs:` re-export).
    outputs:
      merged_artifact_id: ${{ steps.merged-upload.outputs.artifact-id }}
      merged_artifact_digest: ${{ steps.merged-upload.outputs.artifact-digest }}
    steps:
      - name: Download stage1 candidate bundle
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Pull the stage1 bundle into a fresh workspace dir. We
          # will overwrite the Windows entries (binaries, archives,
          # and checksums.txt for those entries) and re-upload a
          # merged bundle.
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" > stage1-transport.zip
          Expand-Archive -LiteralPath stage1-transport.zip -DestinationPath stage1 -Force
          # The upload-artifact action on the build-package job
          # strips the `release/` ancestor before zipping, so the
          # unzipped bundle has entries directly at stage1/public,
          # stage1/internal, stage1/internal/raw. Re-wrap them in
          # a `stage1/release/` prefix so the merge-upload step's
          # path: list (which uses `stage1/release/...`) can
          # strip the same `stage1/release/` ancestor and produce
          # the same top-level `public/`, `internal/` structure
          # that downstream jobs expect.
          New-Item -ItemType Directory -Path stage1\release -Force | Out-Null
          Move-Item -Force stage1\public   stage1\release\public
          Move-Item -Force stage1\internal stage1\release\internal
          Write-Host "--- stage1/release/public/ ---"
          Get-ChildItem stage1\release\public | Select-Object Name, Length
          Write-Host "--- stage1/release/internal/raw/ ---"
          Get-ChildItem stage1\release\internal\raw | Select-Object Name, Length

      - name: Checkout installer
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Build all 5 SEA binaries on Windows
        # Same comment as in ci.yml's smoke-sea (windows x64): on
        # Windows, the tsdown npm shim is `tsdown.cmd` (not the
        # literal `tsdown`), and `spawnSync` of a .cmd batch file
        # needs `shell: true` (EINVAL otherwise). Both fixes are
        # in scripts/build-sea.mjs (PR #114).
        run: node scripts/build-sea.mjs

      - name: Package release assets on Windows
        # Run the packager on Windows. It produces all 5 archives
        # (the same call is platform-agnostic; tsdown's --exe +
        # this script just read the manifest). The Linux + darwin
        # archives produced here are valid as a side effect but we
        # don't ship them — we keep the stage1 versions. The
        # Windows archives are what we ship.
        run: |
          node scripts/package-release-assets.mjs `
            --manifest scripts/release-targets.json `
            --release-dir release

      - name: Stage release assets on Windows
        # Move the packager's flat `release/umactually-windows-x64.zip`
        # + `release/umactually-windows-x64.exe` + `release/checksums.txt`
        # into the `release/public/` + `release/internal/raw/` split
        # that the bundle-upload step expects. Mirrors what
        # scripts/stage-release-assets.mjs does in build-package.
        run: |
          node scripts/stage-release-assets.mjs `
            --release-dir release `
            --manifest scripts/release-targets.json
          # Sanity: confirm 2 Windows archives in public/ and 2
          # Windows raws in internal/raw/ before the merge step.
          $winArchives = (Get-ChildItem release\public\umactually-windows-*.zip).Count
          $winRaws     = (Get-ChildItem release\internal\raw\umactually-windows-*.exe).Count
          Write-Host "windows archives staged: $winArchives (expect 2)"
          Write-Host "windows raws staged:     $winRaws (expect 2)"
          if ($winArchives -ne 2 -or $winRaws -ne 2) {
            Write-Error "::error::staging produced $winArchives archives / $winRaws raws (expected 2/2)"
            exit 1
          }

      - name: Replace stage1 Windows entries with Windows-built entries
        # Overwrite the 2 Windows archives, the 2 Windows .exe raws,
        # and the checksums.txt. Linux + darwin entries from stage1
        # stay untouched. The checksums.txt rewrite is done in the
        # next step (so we get a single combined hash set covering
        # all 5 final assets).
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 2 Windows archives from the Windows build
          Copy-Item -Force release\public\umactually-windows-x64.zip   stage1\release\public\
          Copy-Item -Force release\public\umactually-windows-arm64.zip stage1\release\public\
          # 2 Windows raw binaries
          Copy-Item -Force release\umactually-windows-x64.exe   stage1\release\internal\raw\
          Copy-Item -Force release\umactually-windows-arm64.exe stage1\release\internal\raw\
          # Sanity: confirm we have all 5 archives (2 windows from
          # this build + 2 linux + 1 darwin from stage1).
          $allArchives = Get-ChildItem stage1\release\public\umactually-*.tar.gz,stage1\release\public\umactually-*.zip | Select-Object -ExpandProperty Name
          Write-Host "archives in merged bundle:"
          $allArchives | ForEach-Object { Write-Host "  $_" }
          $expected = @(
            "umactually-linux-x64.tar.gz"
            "umactually-linux-arm64.tar.gz"
            "umactually-darwin-arm64.tar.gz"
            "umactually-windows-x64.zip"
            "umactually-windows-arm64.zip"
          )
          $missing = $expected | Where-Object { $_ -notin $allArchives }
          if ($missing) {
            Write-Error "::error::missing archives in merged bundle: $($missing -join ', ')"
            exit 1
          }

      - name: Recompute checksums.txt over all 5 final assets
        # The stage1 checksums.txt has hashes for the Linux-built
        # Windows archives (which we're throwing away). Recompute
        # over the final 5-asset set so `sha256sum -c checksums.txt`
        # in the downstream smoke + publish jobs passes.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location stage1\release\public
          # sha256sum of every archive + the checksums.txt itself
          # (matches the order used by scripts/package-release-assets.mjs).
          $archives = Get-ChildItem umactually-*.tar.gz,umactually-*.zip | Sort-Object Name
          $lines = @()
          foreach ($a in $archives) {
            $h = (Get-FileHash -LiteralPath $a.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$h  $($a.Name)"
          }
          # checksums.txt itself comes last
          $selfHash = (Get-FileHash -LiteralPath checksums.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$selfHash  checksums.txt"
          # Rewrite the file. The "two-space" separator matches the
          # GNU sha256sum output format that the smoke + publish
          # jobs parse (Get-Content | ForEach-Object { $_ -split '  ', 2 }).
          # Use UTF-8 without BOM so the file is bit-identical to
          # what scripts/package-release-assets.mjs emits (which
          # also writes without BOM).
          $tmpPath = Join-Path $env:TEMP "checksums.txt.tmp"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines($tmpPath, $lines, $utf8NoBom)
          Move-Item -Force $tmpPath checksums.txt
          Write-Host "--- new checksums.txt ---"
          Get-Content checksums.txt

      - name: Recompute release-size-report.json with windows-built sizes
        # The stage1 report has the Linux-built Windows sizes
        # (broken on Windows). The downstream canary reads this
        # report to assert the per-target raw-size budget; the
        # Linux-built numbers are bit-identical for linux + darwin
        # (those binaries weren't rebuilt here), so we can copy
        # the linux + darwin entries from stage1 and only update
        # the windows entries.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = Get-Content stage1\release\internal\release-size-report.json -Raw | ConvertFrom-Json
          # Compute fresh Windows sizes from this build
          $freshWindowsX64   = (Get-ChildItem release\umactually-windows-x64.exe).Length
          $freshWindowsArm64 = (Get-ChildItem release\umactually-windows-arm64.exe).Length
          # Walk the report and overwrite the two Windows entries
          $report.targets = @($report.targets | ForEach-Object {
            $t = $_
            if ($t.target -eq "windows-x64")   { $t.rawBytes = $freshWindowsX64 }
            if ($t.target -eq "windows-arm64") { $t.rawBytes = $freshWindowsArm64 }
            $t
          })
          $json = $report | ConvertTo-Json -Depth 10
          $tmpPath = Join-Path $env:TEMP "release-size-report.json.tmp"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($tmpPath, $json, $utf8NoBom)
          Move-Item -Force $tmpPath stage1\release\internal\release-size-report.json
          Write-Host "--- new release-size-report.json ---"
          Get-Content stage1\release\internal\release-size-report.json

      - name: Verify merged bundle is well-formed
        # Final sanity: confirm 5 archives + 5 raws + 1 checksums +
        # 1 report + 1 manifest, and that the checksums.txt entries
        # all sha256-match. A future change that drops a file or
        # mismatches a hash fails the release here, before publish.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location stage1
          $manifest = Get-Content internal\release-targets.json -Raw | ConvertFrom-Json
          $expected = @($manifest | ForEach-Object { $_.archiveName } | Sort-Object)
          $actual   = @(Get-ChildItem public\umactually-*.tar.gz,public\umactually-*.zip `
                          | Select-Object -ExpandProperty Name | Sort-Object)
          $diff = Compare-Object $expected $actual
          if ($diff) {
            Write-Error "::error::merged bundle archive list diverges from manifest"
            $diff | ForEach-Object { Write-Host "  $($_.SideIndicator) $($_.InputObject)" }
            exit 1
          }
          Set-Location public
          Get-Content checksums.txt | ForEach-Object {
            $parts = $_ -split '  ', 2
            $asset = $parts[1]
            $expectedHash = $parts[0]
            $actualHash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              Write-Error "::error::inner checksum mismatch: $asset (expected $expectedHash, got $actualHash)"
              exit 1
            }
          }
          Write-Host "merged bundle: 5 archives, 5 raws, checksums.txt all match, manifest consistent"

      - name: Upload merged candidate bundle
        id: merged-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-release-candidate-merged
          # Mirror the build-package upload path structure exactly:
          # 4 path entries, each a single directory or file under
          # the shared `release/` ancestor that the upload action
          # strips. This produces a ZIP with top-level entries
          # `public/...`, `internal/...`, `internal/raw/...` that
          # unzips to <dest>/public/... + <dest>/internal/... +
          # <dest>/internal/raw/... — the same layout the existing
          # smoke + publish jobs read.
          #
          # The previous attempt passed `stage1/...` paths to
          # upload-artifact, which produced a different (broken)
          # ZIP structure on Windows: the unzip step ended up with
          # all files at <dest>/internal/raw/ and an empty
          # <dest>/public/. The 4-path form below is the one
          # that works on both Linux and Windows.
          path: |
            stage1/release/public
            stage1/release/internal/raw
            stage1/release/internal/release-size-report.json
            stage1/release/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # (b) Native installer smoke jobs. Each lane downloads the producer's
  #     immutable artifact by numeric ID, verifies its transport digest and
  #     inner manifest, serves public assets from loopback, then executes the
  #     materialized installer in production mode.
  # ---------------------------------------------------------------------
  smoke-linux-x64:
    name: Linux x64 installer smoke
    needs:
      - build-package
      - build-package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package-windows.outputs.merged_artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package-windows.outputs.merged_artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > candidate-transport.zip
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          mkdir -p candidate
          unzip -q candidate-transport.zip -d candidate
      - name: Download exact candidate artifact with pinned action
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-package-windows.outputs.merged_artifact_id }}
          path: candidate
      - name: Verify transport digest and inner checksums
        env:
          EXPECTED_DIGEST: ${{ needs.build-package-windows.outputs.merged_artifact_digest }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          (cd candidate/public && sha256sum -c checksums.txt)
      - name: Serve candidate and install
        env:
          INSTALL_RELEASE_TAG: ${{ github.ref_name }}
          UMACTUALLY_NO_PATH_UPDATE: "1"
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory candidate/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$HOME/.local/bin" "$RUNNER_TEMP/umactually"' EXIT
          # Wait for the server to start accepting connections (up to 5 seconds).
          # Without this, the installer's curl can hit the port before the server
          # has called listen(), producing a 0ms "Failed to connect" error.
          for _i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/checksums.txt" -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          export INSTALL_RELEASE_BASE="http://127.0.0.1:$PORT"
          sh scripts/install.sh
          INSTALL_DIR="$HOME/.local/bin"
          test -x "$INSTALL_DIR/umactually"
          "$INSTALL_DIR/umactually" --version
          "$INSTALL_DIR/umactually" --help >/dev/null
          "$INSTALL_DIR/umactually" doctor

  smoke-linux-arm64:
    name: Linux ARM64 installer smoke
    needs:
      - build-package
      - build-package-windows
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package-windows.outputs.merged_artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package-windows.outputs.merged_artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > candidate-transport.zip
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          mkdir -p candidate
          unzip -q candidate-transport.zip -d candidate
      - name: Download exact candidate artifact with pinned action
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-package-windows.outputs.merged_artifact_id }}
          path: candidate
      - name: Verify transport digest and inner checksums
        env:
          EXPECTED_DIGEST: ${{ needs.build-package-windows.outputs.merged_artifact_digest }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          (cd candidate/public && sha256sum -c checksums.txt)
      - name: Serve candidate and install
        env:
          INSTALL_RELEASE_TAG: ${{ github.ref_name }}
          UMACTUALLY_NO_PATH_UPDATE: "1"
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory candidate/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$HOME/.local/bin" "$RUNNER_TEMP/umactually"' EXIT
          # Wait for the server to start accepting connections (up to 5 seconds).
          # Without this, the installer's curl can hit the port before the server
          # has called listen(), producing a 0ms "Failed to connect" error.
          for _i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/checksums.txt" -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          export INSTALL_RELEASE_BASE="http://127.0.0.1:$PORT"
          sh scripts/install.sh
          INSTALL_DIR="$HOME/.local/bin"
          test -x "$INSTALL_DIR/umactually"
          "$INSTALL_DIR/umactually" --version
          "$INSTALL_DIR/umactually" --help >/dev/null
          "$INSTALL_DIR/umactually" doctor

