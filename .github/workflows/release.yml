name: Release

run-name: Release verification ${{ inputs.correlation || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish flag. true = publish this ref directly (same as a tag push). false = dry-run, creates a draft for QA review. Default is false (verify-only)."
        type: boolean
        required: false
        default: false
      correlation:
        description: "QA correlation id (required for dispatch runs)."
        type: string
        required: true

# Each tag gets its own release; never cancel a release run because a
# follow-up tag was pushed while the previous one was still building —
# the previous release may have already uploaded partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: no top-level permissions. Every job declares its own.
# Only the `publish` job holds `contents: write`; everything else is
# `contents: read` / `actions: read`.
permissions: {}

jobs:
  # ---------------------------------------------------------------------
  # (a) Build/package on ubuntu-24.04. Generates the six archives,
  #     checksums.txt, and release-size-report.json, then uploads ONE
  #     immutable Actions artifact named `umactually-release-candidate`
  #     with the exact root layout:
  #       public/<six archives>           (compressed download assets)
  #       public/checksums.txt            (sha256 manifest)
  #       internal/raw/<six raw binaries> (Bun output, kept internal)
  #       internal/release-size-report.json (size telemetry, kept internal)
  #     with no other files. The upload step ID is `candidate-upload` so
  #     publish/canary can pull the artifact by its stable id via the
  #     `actions/artifacts/<id>/zip` API.
  # ---------------------------------------------------------------------
  build-package:
    name: build & package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile standalone binaries
        run: node scripts/build-binary.mjs

      - name: Package release assets (archives + checksums)
        run: |
          mkdir -p release/public release/internal/raw
          # Packager writes into --release-dir (default) so the verifier can
          # see both archives and raws from the same root. The staging step
          # below splits the flat layout into public/ and internal/raw/.
          node scripts/package-release-assets.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release

      - name: Compute release-size report
        run: |
           node scripts/verify-release-assets.mjs \
             --manifest scripts/release-targets.json \
             --release-dir release \
             --measure \
             --bun-version "$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync("scripts/release-size-budget.json", "utf8")).bunVersion)')" \
             --report release/internal/release-size-report.json

      - name: Stage candidate bundle (public/<archives>, public/checksums.txt, internal/raw/<binaries>, internal/release-size-report.json)
        run: |
          set -euo pipefail
          # After packager + verifier the flat `release/` root holds both
          # archives and raws. Split it into the public/internal layout via
          # the shared staging script — same script the CI dry-run uses so
          # the production build and the PR-time guarantee exercise one
          # path.
          node scripts/stage-release-assets.mjs \
            --release-dir release \
            --manifest scripts/release-targets.json
          ls -la release/public
          ls -la release/internal/raw
          test -f release/internal/release-size-report.json

      - name: Upload candidate bundle
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-release-candidate
          # This input is workspace-relative. actions/upload-artifact
          # archives the *contents* of each `path:` and strips the
          # shared `release/` ancestor — so the published ZIP has
          # entries `public/...`, `internal/...`, `internal/raw/...`
          # (no `release/` prefix). After publish unzips the candidate
          # bundle, the manifest lives at
          #   $RUNNER_TEMP/umactually-release-candidate/internal/release-targets.json
          # and the publish job's Node helpers `cd` into that bundle
          # root before reading it. The canary reads the in-repo
          # `scripts/release-targets.json` from `GITHUB_WORKSPACE`
          # instead — it does not download the artifact.
          path: |
            release/public
            release/internal/raw
            release/internal/release-size-report.json
            release/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # (b) Native installer smoke jobs. Each lane downloads the producer's
  #     immutable artifact by numeric ID, verifies its transport digest and
  #     inner manifest, serves public assets from loopback, then executes the
  #     materialized installer in production mode.
  # ---------------------------------------------------------------------
  smoke-linux-x64:
    name: Linux x64 installer smoke
    needs: build-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > candidate-transport.zip
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          mkdir -p candidate
          unzip -q candidate-transport.zip -d candidate
      - name: Download exact candidate artifact with pinned action
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact_id }}
          path: candidate
      - name: Verify transport digest and inner checksums
        env:
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          (cd candidate/public && sha256sum -c checksums.txt)
      - name: Serve candidate and install
        env:
          INSTALL_RELEASE_TAG: ${{ github.ref_name }}
          UMACTUALLY_NO_PATH_UPDATE: "1"
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory candidate/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$HOME/.local/bin" "$RUNNER_TEMP/umactually"' EXIT
          # Wait for the server to start accepting connections (up to 5 seconds).
          # Without this, the installer's curl can hit the port before the server
          # has called listen(), producing a 0ms "Failed to connect" error.
          for _i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/checksums.txt" -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          export INSTALL_RELEASE_BASE="http://127.0.0.1:$PORT"
          sh scripts/install.sh
          INSTALL_DIR="$HOME/.local/bin"
          test -x "$INSTALL_DIR/umactually"
          "$INSTALL_DIR/umactually" --version
          "$INSTALL_DIR/umactually" --help >/dev/null
          "$INSTALL_DIR/umactually" doctor

  smoke-linux-arm64:
    name: Linux ARM64 installer smoke
    needs: build-package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
