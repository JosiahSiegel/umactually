name: Release

run-name: Release verification ${{ inputs.correlation || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish flag. true = publish this ref directly (same as a tag push). false = dry-run, creates a draft for QA review. Default is false (verify-only)."
        type: boolean
        required: false
        default: false
      correlation:
        description: "QA correlation id (required for dispatch runs)."
        type: string
        required: true
      tag:
        description: 'Synthetic semver tag (e.g. v0.0.0-test) used by the smoke jobs when the real ref is a branch name (workflow_dispatch dry-runs). MUST match the synthetic-tag pattern (see `pattern:` below); leave empty to use github.ref_name (the real release tag for push.tags triggers). A real release tag (e.g. v0.6.6) is rejected to prevent a dry-run dispatch from accidentally publishing against or racing a real release.'
        type: string
        required: false
        default: ''
        # Pattern: enforce synthetic-tag format. The installer regex
        # (scripts/install.sh) accepts any vX.Y.Z, so a real release
        # tag is also a valid install target. This pattern is the
        # inverse: rejects anything that looks like a real release
        # tag (vX.Y.Z where X.Y.Z != 0.0.0) so a maintainer who
        # mistypes the dispatch input as `v0.6.6` (the current real
        # release) gets a workflow validation error instead of
        # silently publishing against the real release. Empty
        # string is allowed (the default — falls through to
        # github.ref_name). Single-quoted YAML scalar: GitHub
        # Actions' workflow YAML parser only recognises the
        # `pattern:` field as a regex, NOT a shell glob; single
        # quotes avoid YAML 1.2 escape-sequence processing of the
        # backslashes.
        pattern: '^(|v0\.0\.0-[a-z0-9-]+)$'

# Each tag gets its own release; never cancel a release run because a
# follow-up tag was pushed while the previous one was still building —
# the previous release may have already uploaded partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege: no top-level permissions. Every job declares its own.
# Only the `publish` job holds `contents: write`; everything else is
# `contents: read` / `actions: read`.
permissions: {}

jobs:
  # ---------------------------------------------------------------------
  # (a) Cross-platform producer (ubuntu-24.04). Builds ALL 5 SEA
  #     binaries (the underlying tsdown --exe mode has no per-target
  #     flag — targets are config-driven) and packages the linux +
  #     darwin archives and raws into a partial candidate bundle
  #     named `umactually-non-windows-candidate`. The Windows producer
  #     (build-package-windows) handles windows-x64 + windows-arm64;
  #     the merger (build-package, further down) combines the two
  #     per-platform bundles into the final `umactually-release-candidate`
  #     the smoke + publish jobs consume.
  #
  #     Why two producers + a merger (vs. building everything in one
  #     job on ubuntu-24.04): the v0.6.1+ post-release failures
  #     shipped a Windows .exe built on Linux, which is structurally
  #     different (1024-byte Node 25.7.0 SEA blob delta) from one
  #     built on Windows. Building each .exe on its native platform
  #     and merging per-platform bundles into the final candidate is
  #     the only way to ship a working Windows binary without
  #     cross-compiling tsdown per-target.
  # ---------------------------------------------------------------------
  build-package-cross:
    name: build & package (linux + darwin)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "25.7.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile Node SEA standalone binaries
        run: node scripts/build-sea.mjs

      - name: Package release assets (archives + checksums)
        run: |
          mkdir -p release/public release/internal/raw
          # Packager writes into --release-dir (default) so the verifier can
          # see both archives and raws from the same root. The staging step
          # below splits the flat layout into public/ and internal/raw/.
          node scripts/package-release-assets.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release

      - name: Compute release-size report
        # v0.6.0: the Bun-version-pinned verify-release-assets.mjs is
        # gone. We replaced it with a per-target output check that
        # confirms each manifest target produced an output AND that the
        # raw binary stays under a sane per-target ceiling. tsdown's
        # --exe enforces bundle size internally; this ceiling is a
        # safety net for a runaway build (e.g. a new dep pulls in a
        # 500 MB native module). The smoke-sea job in ci.yml is the
        # runtime check.
        #   - MIN_RAW_BYTES (1 MiB): rejects an empty / truncated file
        #     that "exists but is broken" — a partial SEA blob is worse
        #     than a missing one because the installer downloads it,
        #     sha256-passes (the chunk is self-consistent), then
        #     crashes on launch.
        #   - MAX_RAW_BYTES (200 MiB): hard cap. As of v0.6.0 the
        #     largest target is darwin-arm64 at ~125 MiB. 200 MiB leaves
        #     ~50% headroom for legitimate growth (e.g. a new dep
        #     tree) and is far below the installer's pipe-buffer
        #     concerns. Any new target that legitimately needs more
        #     room must bump this number AND the docs/ release-process
        #     section that documents it.
        #
        # The step is split into two `run:` blocks so a verifier
        # non-zero exit (MISSING / TOO_SMALL / TOO_LARGE) is the last
        # command bash sees and therefore propagates as the step's
        # exit code. Previously the verifier + `test -f` lived in one
        # block; the `test -f` could mask a verifier silent-exit bug
        # (a future change to verify-release-sizes.mjs that wrote the
        # JSON but exited 0 incorrectly) and let the workflow publish
        # with a tampered report. Fail-closed: if the verifier exits
        # non-zero, the workflow stops before staging.
        run: |
          set -euo pipefail
          # MIN_RAW_BYTES (1 MiB) and MAX_RAW_BYTES (200 MiB) are owned
          # by scripts/verify-release-sizes.mjs (also called by
          # scripts/ci-release-pipeline-dry-run.sh). Both call sites
          # delegate to the same module so the thresholds and the
          # size-report JSON shape cannot drift between the release
          # build and the PR-time dry-run. Bumping the ceiling
          # requires editing one constant; the docs cross-reference
          # both call sites.
          node scripts/verify-release-sizes.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release
      - name: Lock release-size-report.json path
        # Lock the report path explicitly so a future change to the
        # verifier (e.g. a --report flag flip) doesn't silently let
        # the file land elsewhere and break the staging step. This
        # runs as a SEPARATE step from the verifier so the verifier's
        # non-zero exit (MISSING / TOO_SMALL / TOO_LARGE) propagates
        # correctly; the test does NOT mask a verifier silent-exit bug.
        run: |
          set -euo pipefail
          test -f release/internal/release-size-report.json

      - name: Stage candidate bundle (public/<archives>, public/checksums.txt, internal/raw/<binaries>, internal/release-size-report.json)
        run: |
          set -euo pipefail
          # After packager + verifier the flat `release/` root holds both
          # archives and raws. Split it into the public/internal layout via
          # the shared staging script — same script the CI dry-run uses so
          # the production build and the PR-time guarantee exercise one
          # path.
          node scripts/stage-release-assets.mjs \
            --release-dir release \
            --manifest scripts/release-targets.json
          ls -la release/public
          ls -la release/internal/raw
          test -f release/internal/release-size-report.json

      - name: Drop Windows outputs from the non-Windows bundle
        # The build above produces all 5 binaries, but this job is
        # only responsible for the linux + darwin halves of the
        # release. Strip the Windows archives and raws from
        # release/ before uploading so the merger (build-package) only
        # sees this job's targets in this artifact.
        run: |
          set -euo pipefail
          rm -f release/public/umactually-windows-x64.zip
          rm -f release/public/umactually-windows-arm64.zip
          rm -f release/internal/raw/umactually-windows-x64.exe
          rm -f release/internal/raw/umactually-windows-arm64.exe
          # Recompute checksums.txt to match the now-Windows-less
          # public/ directory. The merger will recompute again over
          # the merged public/, so the values here are only consumed
          # by the post-staging self-check.
          # NOTE: we use `sha256sum -- *` (all files) rather than
          # `sha256sum -- *.tar.gz *.zip`. The pattern *.zip is a
          # no-op now (we just deleted the .zip files), and bash's
          # nullglob would still pass the literal `*.zip` string to
          # sha256sum which then fails with
          # "'*.zip': No such file or directory". The `*` form
          # matches whatever files remain (only *.tar.gz) and is
          # equally self-documenting.
          (cd release/public && sha256sum -- * > checksums.txt)
          test ! -f release/public/umactually-windows-x64.zip
          test ! -f release/public/umactually-windows-arm64.zip
          ls -la release/public
          ls -la release/internal/raw

      - name: Upload non-Windows candidate bundle
        id: non-windows-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-non-windows-candidate
          # Mirrors the build-package upload path structure exactly:
          # 4 path entries, each a single directory or file under the
          # shared `release/` ancestor that the upload action strips.
          # The merger (build-package) downloads this artifact via
          # actions/download-artifact@v8, which extracts the same
          # `public/...`, `internal/...`, `internal/raw/...` layout
          # the existing publish + smoke jobs expect.
          path: |
            release/public
            release/internal/raw
            release/internal/release-size-report.json
            release/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # (a.5) Windows producer (windows-2025). Builds ALL 5 SEA binaries
  #       (the underlying tsdown --exe mode has no per-target flag —
  #       targets are config-driven), then packages the windows-x64 +
  #       windows-arm64 archives and raws into a partial candidate
  #       bundle named `umactually-windows-candidate`. The merger
  #       (build-package, further down) combines it with
  #       umactually-non-windows-candidate from build-package-cross.
  #
  #       Why this job exists on a Windows runner: a Windows .exe
  #       built on ubuntu-24.04 has a 1024-byte Node 25.7.0 SEA blob
  #       delta from a Windows-built one, and that delta causes a
  #       pipe-drain race that produces empty stdout on real Windows.
  #       v0.6.1+ shipped this broken binary. Building on Windows is
  #       the only way to ship a working Windows binary.
  # ---------------------------------------------------------------------
  build-package-windows:
    name: build & package (windows)
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.windows-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.windows-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        # v0.6.4: pinned to 25.6.0 (not 25.7.0) because Node 25.7.0's
        # SEA runtime on Windows fails to load CJS bundles whose
        # modules use `node:`-prefixed imports (the Windows binary
        # exits 1 with empty --version output; the same CJS bundle
        # built and run on Linux works correctly). v0.6.0 (the last
        # release with a working Windows binary) was built with
        # Node 25.6.x. Linux/darwin builds continue to use 25.7.0
        # (unchanged) because the regression is Windows-specific.
        uses: actions/setup-node@v7
        with:
          node-version: "25.6.0"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        shell: bash
        run: npm run build

      - name: Build Windows SEA standalone binaries
        # v0.6.4: switched from `node scripts/build-sea.mjs` (which
        # delegates to @tsdown/exe) to `node scripts/build-sea-windows.mjs`.
        # @tsdown/exe's tar-based Node binary download path is broken on
        # Windows: tar on Windows interprets the colon in
        # `https://nodejs.org/dist/.../node-v25.6.0-win-x64.zip` as a
        # drive letter (`C:`) and exits with
        # "Cannot connect to C: resolve failed" (origin: @tsdown/exe
        # dist/index.mjs:163, `extractBinary`).
        #
        # The new script uses `node --build-sea=<config>` directly
        # (Node 25.5+ core command) with config.output pointing at the
        # final binary path. The injection happens in-place into
        # `process.execPath` (the Windows Node binary already installed
        # by `actions/setup-node`), so the output is a real Windows
        # .exe. No separate download, no tar, no concat. The script is
        # Linux-rejected (asserts process.platform === "win32") so it
        # cannot accidentally run in the wrong job.
        shell: bash
        run: node scripts/build-sea-windows.mjs

      - name: Write windows-only release manifest
        # The Windows producer only built windows-x64 + windows-arm64.
        # The verifier and stage-release-assets iterate over the
        # manifest and would report the missing linux/darwin raw
        # files as MISSING. Write a filtered manifest to a side file
        # and pass it to those two steps. The packager takes a
        # different code path (--members regex) so it can use the
        # full manifest.
        #
        # The output goes to scripts/release-targets.windows.json.
        # scripts/ is gitignored; release/ is the uploaded artifact
        # and would carry the filtered manifest into the public
        # release if we wrote it there.
        shell: bash
        run: |
          node scripts/write-filtered-manifest.mjs \
            --input scripts/release-targets.json \
            --output scripts/release-targets.windows.json \
            --include '^windows-'

      - name: Package release assets (windows-only archives + checksums)
        # --members regex filters the packager's iteration to just
        # the windows-* targets. The full manifest would error on
        # the missing linux/darwin raw files because this job never
        # built them. (parseReleaseTargets validates the full
        # manifest has 5 targets, so we cannot pass a windows-only
        # manifest here — the regex filter is the documented escape
        # hatch.)
        shell: bash
        run: |
          mkdir -p release/public release/internal/raw
          node scripts/package-release-assets.mjs \
            --manifest scripts/release-targets.json \
            --release-dir release \
            --members '^windows-'

      - name: Compute release-size report (windows-only)
        # verify-release-sizes accepts any manifest shape (it does
        # not go through parseReleaseTargets), so the windows-only
        # manifest is fine here and only checks the windows-x64 +
        # windows-arm64 raw files this job produced.
        shell: bash
        run: |
          node scripts/verify-release-sizes.mjs \
            --manifest scripts/release-targets.windows.json \
            --release-dir release

      - name: Lock release-size-report.json path
        shell: bash
        run: test -f release/internal/release-size-report.json

      - name: Stage candidate bundle
        # stage-release-assets accepts any manifest shape too, so
        # the windows-only manifest is fine here.
        shell: bash
        run: |
          node scripts/stage-release-assets.mjs \
            --release-dir release \
            --manifest scripts/release-targets.windows.json
          ls -la release/public
          ls -la release/internal/raw
          test -f release/internal/release-size-report.json

      - name: Drop non-Windows outputs from the Windows bundle
        # This job only built the windows-x64 + windows-arm64
        # binaries, so there are no non-Windows files to drop. The
        # `rm -f` calls are no-ops (and the `test ! -f` self-check
        # passes vacuously) — they remain as documentation of
        # which targets this job is responsible for AND as a guard
        # against a future change that introduces a cross-platform
        # build step in this job (e.g. a tsdown config flip that
        # builds linux binaries on Windows). The `sha256sum -- *`
        # form matches whatever files exist in public/ (currently
        # only the windows .zip files); the `*.zip` glob is fragile
        # on Windows bash when no .tar.gz files exist.
        shell: bash
        run: |
          set -euo pipefail
          rm -f release/public/umactually-linux-x64.tar.gz
          rm -f release/public/umactually-linux-arm64.tar.gz
          rm -f release/public/umactually-darwin-arm64.tar.gz
          rm -f release/internal/raw/umactually-linux-x64
          rm -f release/internal/raw/umactually-linux-arm64
          rm -f release/internal/raw/umactually-darwin-arm64
          (cd release/public && sha256sum -- * > checksums.txt)
          test ! -f release/public/umactually-linux-x64.tar.gz
          test ! -f release/public/umactually-linux-arm64.tar.gz
          test ! -f release/public/umactually-darwin-arm64.tar.gz
          ls -la release/public
          ls -la release/internal/raw

      - name: Upload Windows candidate bundle
        id: windows-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-windows-candidate
          path: |
            release/public
            release/internal/raw
            release/internal/release-size-report.json
            release/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # (a.6) Merger (ubuntu-24.04). Combines the two per-platform
  #       candidate bundles (linux+darwin from build-package-cross,
  #       windows from build-package-windows) into a single final
  #       bundle named `umactually-release-candidate`. The merger
  #       re-runs on every dispatch so any divergence between the
  #       two per-platform inputs is caught BEFORE the smoke + publish
  #       jobs see the final candidate.
  #
  #       Why the merger is a separate job (not a step in either
  #       producer): the merge needs both per-platform artifacts to
  #       exist, and each producer is platform-bound (ubuntu-24.04
  #       for linux+darwin, windows-2025 for windows). The merger
  #       runs on ubuntu-24.04 because the merge script
  #       (scripts/merge-candidate-bundles.mjs) is POSIX-only and the
  #       publish job (which consumes the merged bundle) is also
  #       ubuntu-24.04.
  # ---------------------------------------------------------------------
  build-package:
    name: build & package (merge)
    needs:
      - build-package-cross
      - build-package-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download non-Windows candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: umactually-non-windows-candidate
          path: non-windows
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Windows candidate bundle
        uses: actions/download-artifact@v8
        with:
          name: umactually-windows-candidate
          path: windows
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-platform bundles into the final candidate
        # scripts/merge-candidate-bundles.mjs:
        #   1. copies non-windows archives + raws from `non-windows/`
        #      to `merged/` (linux-x64, linux-arm64, darwin-arm64)
        #   2. copies windows archives + raws from `windows/` to
        #      `merged/` (windows-x64, windows-arm64)
        #   3. recomputes checksums.txt from the merged public/ so a
        #      single checksums.txt covers all 5 archives (the
        #      per-platform checksums.txt files only cover their
        #      respective halves)
        #   4. recomputes release-size-report.json from the merged
        #      raws so a single report covers all 5
        #   5. runs `sha256sum -c checksums.txt` as a self-check
        #      before uploading
        # Any of those steps failing is a hard error and aborts the
        # build (the script throws on any non-zero exit).
        run: |
          set -euo pipefail
          node scripts/merge-candidate-bundles.mjs \
            --non-windows non-windows \
            --windows windows \
            --manifest scripts/release-targets.json \
            --output merged
          ls -la merged/public
          ls -la merged/internal/raw
          test -f merged/public/checksums.txt
          test -f merged/internal/release-size-report.json
          test -f merged/internal/release-targets.json

      - name: Upload final candidate bundle
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: umactually-release-candidate
          # Same 4-path form as the per-platform producers. The
          # actions/upload-artifact action strips the shared `merged/`
          # ancestor, so the published ZIP has top-level entries
          # `public/...`, `internal/...`, `internal/raw/...` that
          # unzips to the exact layout the smoke + publish jobs read
          # (and the contract tests verify, e.g. RELEASE-WORKFLOW-
          # CONTRACT expects `cd candidate/public && sha256sum -c
          # checksums.txt` to work).
          path: |
            merged/public
            merged/internal/raw
            merged/internal/release-size-report.json
            merged/internal/release-targets.json
          if-no-files-found: error
          retention-days: 14

  # (b) Native installer smoke jobs. Each lane downloads the producer's
  #     immutable artifact by numeric ID, verifies its transport digest and
  #     inner manifest, serves public assets from loopback, then executes the
  #     materialized installer in production mode.
  # ---------------------------------------------------------------------
  smoke-linux-x64:
    name: Linux x64 installer smoke
    needs: build-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > candidate-transport.zip
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          mkdir -p candidate
          unzip -q candidate-transport.zip -d candidate
      - name: Download exact candidate artifact with pinned action
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact_id }}
          path: candidate
      - name: Verify transport digest and inner checksums
        env:
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          (cd candidate/public && sha256sum -c checksums.txt)
      - name: Serve candidate and install
        env:
          INSTALL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UMACTUALLY_NO_PATH_UPDATE: "1"
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory candidate/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$HOME/.local/bin" "$RUNNER_TEMP/umactually"' EXIT
          # Wait for the server to start accepting connections (up to 5 seconds).
          # Without this, the installer's curl can hit the port before the server
          # has called listen(), producing a 0ms "Failed to connect" error.
          for _i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/checksums.txt" -o /dev/null 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          export INSTALL_RELEASE_BASE="http://127.0.0.1:$PORT"
          sh scripts/install.sh
          INSTALL_DIR="$HOME/.local/bin"
          test -x "$INSTALL_DIR/umactually"
          "$INSTALL_DIR/umactually" --version
          "$INSTALL_DIR/umactually" --help >/dev/null
          "$INSTALL_DIR/umactually" doctor

  smoke-linux-arm64:
    name: Linux ARM64 installer smoke
    needs: build-package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout installer
        uses: actions/checkout@v4
      - name: Download exact candidate artifact
        env:
          ARTIFACT_ID: ${{ needs.build-package.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > candidate-transport.zip
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          mkdir -p candidate
          unzip -q candidate-transport.zip -d candidate
      - name: Download exact candidate artifact with pinned action
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-package.outputs.artifact_id }}
          path: candidate
      - name: Verify transport digest and inner checksums
        env:
          EXPECTED_DIGEST: ${{ needs.build-package.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum candidate-transport.zip | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_DIGEST"
          (cd candidate/public && sha256sum -c checksums.txt)
      - name: Serve candidate and install
        env:
          INSTALL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UMACTUALLY_NO_PATH_UPDATE: "1"
        run: |
          set -euo pipefail
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory candidate/public &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$HOME/.local/bin" "$RUNNER_TEMP/umactually"' EXIT
          # Wait for the server to start accepting connections (up to 5 seconds).
          # Without this, the installer's curl can hit the port before the server
          # has called listen(), producing a 0ms "Failed to connect" error.
          for _i in $(seq 1 50); do
