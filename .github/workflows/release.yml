name: Release

on:
  push:
    tags:
      - "v*"

# Each tag gets its own release; never cancel a release run because a
# follow-up tag was pushed while the previous one was still building —
# the previous release may have already uploaded partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (dist/ + sanity-check source)
        run: npm run build

      - name: Cross-compile standalone binaries
        run: node scripts/build-binary.mjs

      - name: Smoke test (--version)
        run: ./release/umactually-linux-x64 --version

      - name: Smoke test (doctor)
        run: ./release/umactually-linux-x64 doctor

      - name: Smoke test (--help)
        run: ./release/umactually-linux-x64 --help

      - name: Compute SHA-256 checksums
        working-directory: release
        run: sha256sum umactually-* > checksums.txt

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: umactually-windows-x64
          path: release/umactually-windows-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/umactually-linux-x64
            release/umactually-linux-arm64
            release/umactually-darwin-x64
            release/umactually-darwin-arm64
            release/umactually-windows-x64.exe
            release/checksums.txt

  windows-smoke:
    name: Windows binary smoke
    needs: release
    runs-on: windows-latest
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: umactually-windows-x64
          path: .
      - name: Smoke test
        shell: pwsh
        run: .\umactually-windows-x64.exe --version
