# Mirrors the `umactually init --ci github` wizard emit.
# This file is the action's "example basic usage" — it IS the same
# shortform body the wizard writes to `.github/workflows/umactually-pr-review.yml`,
# copy-pasted into the action repo's `examples/` directory for operator
# discovery. Drift-tested against `examples/github/pr-review.yml.action-ref.yml`
# in `test/unit/init-templates-drift.test.ts` (the source of truth is the
# wizard emit, NOT this file).
#
# Quick start:
#   1. Add two repo secrets: `UMACTUALLY_API_URL`, `UMACTUALLY_API_KEY`.
#   2. Save this file at `.github/workflows/umactually-pr-review.yml`.
#   3. Open a PR. The action runs on every pull_request event.
# Runs umactually via the published GitHub Action for pull requests.
# Action: https://github.com/JosiahSiegel/umactually-action
name: PR review
on: [pull_request]
concurrency:
  group: umactually-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run umactually PR review
        uses: JosiahSiegel/umactually-action@v1
        with:
          cli-version: __UMACTUALLY_VERSION__
          api-url: ${{ secrets.UMACTUALLY_API_URL }}
          api-key: ${{ secrets.UMACTUALLY_API_KEY }}
          provider: openai-compatible
          config-path: ./umactually.review.json
          output-artifact: umactually-review.json
          skip-draft: 'true'
          paths-ignore: '**/*.md,docs/**,**/*.lock'