# Runs umactually as a pinned npm CLI for pull requests.
# This is the longform/inline variant — no action SHA to pin because the
# workflow is fully inline (`npm install -g umactually@<version>` + `umactually
# review`). The same trigger, paths-filter, and concurrency posture apply.
name: PR review
on:
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.py"
      - "**.go"
      - "**.rs"
      - "**.java"
      - "**.kt"
      - "**.swift"
      - "**.rb"
      - "**.sh"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.json"
      - "Dockerfile"
      - "!.github/workflows/pr-review.yml"
concurrency:
  group: umactually-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install umactually
        # Pin the version; never track `latest`.
        run: npm install -g umactually@0.9.4
      - name: Run umactually PR review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UMACTUALLY_API_URL: ${{ secrets.UMACTUALLY_API_URL }}
          UMACTUALLY_API_KEY: ${{ secrets.UMACTUALLY_API_KEY }}
        run: umactually review --platform github
