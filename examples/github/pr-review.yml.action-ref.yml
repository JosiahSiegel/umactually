# Runs umactually via the published GitHub Action for pull requests.
# Action: https://github.com/JosiahSiegel/umactually-action
name: PR review
on:
  pull_request:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "**.py"
      - "**.go"
      - "**.rs"
      - "**.java"
      - "**.kt"
      - "**.swift"
      - "**.rb"
      - "**.sh"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.json"
      - "Dockerfile"
      - "!.github/workflows/pr-review.yml"
concurrency:
  group: umactually-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run umactually PR review
        uses: JosiahSiegel/umactually-action@9924e799c11ae31a694caf761bdfe7d66b7e78e9  # v1
        with:
          cli-version: __UMACTUALLY_VERSION__
          provider: openai-compatible
          api-url: ${{ secrets.UMACTUALLY_API_URL }}
          api-key: ${{ secrets.UMACTUALLY_API_KEY }}
