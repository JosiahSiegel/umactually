# SPDX-License-Identifier: MIT
# GitGuardian configuration — per-repo secret-detection rules.
#
# Schema reference:
#   https://docs.gitguardian.com/ggshield-docs/configuration
#   https://github.com/GitGuardian/ggshield/blob/main/.gitguardian.example.yml
#
# Why this file exists
# --------------------
# The UmActually self-review pipeline uses GitGuardian's GitHub App
# to scan every PR for committed secrets. The detector is calibrated
# for HIGH RECALL — it intentionally flags any long random-looking
# string assigned to a variable named `apiKey`, `token`, `secret`,
# etc. (the ContentWhitelistPreValidator in
# docs.gitguardian.com/secrets-detection-engine/detectors/generics/
# generic_high_entropy_secret). This is exactly the right posture for
# production code, but it produces predictable false positives on
# the synthetic test fixtures UmActually uses throughout its test
# suite.
#
# Sentinel convention
# -------------------
# All synthetic test API keys in this repo use the literal
# `do-not-leak` suffix (e.g. `sk-anthropic-v2-do-not-leak`,
# `sk-test-openai-do-not-leak`, `sk-minimax-smoke-test-do-not-leak`).
# The suffix is a deliberate tripwire — a maintainer who copies a
# fixture into a real config file and forgets to swap it would
# search the repo and find this comment, plus the fixture would be
# caught by the next reviewer who runs a `rg do-not-leak src/`.
# Convention enforced in:
#   - test/unit/live-provider-cross-protocol-dispatch.test.ts
#   - test/unit/live-provider-anthropic-dispatch.test.ts
#   - test/unit/anthropic-messages.test.ts
#   - test/unit/live-shared-body.test.ts
#   - test/unit/live-shared-prepare-posted-review.test.ts
#   - test/unit/live-azure-parent-clarity.test.ts
#   - test/unit/provider.test.ts
#   - test/unit/provider-retry.test.ts
#   - test/unit/redact-url-for-log.test.ts
#   - test/unit/verdict-reconciliation.test.ts
#
# Historical incident
# -------------------
# Incident 34696725 (2026-07-10): GitGuardian flagged
# `sk-anthropic-v2-do-not-leak` in
# test/unit/live-provider-cross-protocol-dispatch.test.ts:507 as a
# "Generic High Entropy Secret". The test paths below are excluded
# so future scans do not re-trigger. The dashboard incident should
# be marked resolved in the GitGuardian workspace once this file
# lands in the default branch.
#
# Design choices
# --------------
# - `version: 2` is required; v1 is deprecated.
# - `ignored_paths` excludes test directories and build artifacts
#   (the high-entropy detector's only consistent FP source in this
#   repo). We do NOT add a global `ignored_detectors` entry for
#   `Generic High Entropy Secret` — that would weaken detection
#   for production code (`src/`), which is the highest-stakes
#   surface for accidental secret commits.
# - `docs/**`, `**/*.md`, `LICENSE`, `CHANGELOG*` excluded per
#   GitGuardian's recommended-filepath-exclusions list.
# - `artifacts/**` excluded because the test pipeline writes
#   redaction-report fixtures and provider-response cassettes
#   there; these are checked in for the self-review regression
#   suite and routinely contain synthetic API responses.
# - `examples/**` is NOT excluded — the example workflows use
#   `${{ secrets.* }}` references and any committed literal in
#   that path would be a real finding.
# - `src/**` is NOT excluded — production code is the surface
#   that needs the most aggressive scanning.
version: 2

secret:
  # Exclude paths that are EXPECTED to contain synthetic / sample
  # values. The high-entropy detector is reliable for src/ and
  # bin/ (real code paths) and noisy for test/ (synthetic fixtures
  # by design).
  ignored_paths:
    # Test code and test fixtures — every secret in these paths
    # follows the `do-not-leak` sentinel convention.
    - 'test/**'
    - 'tests/**'
    - '**/*.test.ts'
    - '**/*.spec.ts'
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/fixtures/**'
    - '**/__snapshots__/**'
    # Build artifacts and tooling output — ncc bundles, TypeScript
    # build info, coverage reports, layout-viewer build dir.
    - 'dist/**'
    - 'dist-tmp/**'
    - 'build/**'
    - 'coverage/**'
    - '**/*.tsbuildinfo'
    - '.layout-viewer-build/**'
    # Per-run self-review artifacts — cassettes, redaction reports,
    # and manual review logs checked in for regression coverage.
    - 'artifacts/**'
    # Documentation — example API URLs and placeholder patterns
    # appear throughout. Per GitGuardian's recommended exclusion
    # list for Markdown / reStructuredText.
    - 'docs/**'
    - '**/*.md'
    - '**/*.rst'
    - 'LICENSE'
    - 'CHANGELOG*'
    # Editor / OS scratch and Playwright caches. .gitignore
    # already covers most of these, but listing them here too
    # makes the GitGuardian config self-contained.
    - '.playwright-mcp/**'
    - '.DS_Store'
    - 'Thumbs.db'
    # Dependabot / GitHub metadata — not a code surface.
    - '.github/dependabot.yml'

  # Per-occurrence ignores. The 9 historical synthetic API keys
  # from the cross-protocol-dispatch test file are pre-registered
  # here as SHA256 occurrence hashes so the corresponding dashboard
  # incidents auto-resolve the next time the scanner runs.
  #
  # Form: bare SHA256 of the secret VALUE (NO surrounding quotes —
  # GitGuardian's parser reads the match value as a plain string, so
  # quoted values are matched as `'<value>'` with literal apostrophes
  # and would not match the secret in the test file. Bare scalars
  # are the correct form per the GitGuardian schema).
  #
  # The 9 historical fixtures below are stable, so the SHA256 of the
  # value is also stable. If a maintainer copies one of the literal
  # values into a NEW path (e.g. `src/`), the SHA256 of that copy
  # would be the same — but `src/` is not in the `ignored_paths`
  # list above, so the scanner would still see it. The SHA256 form
  # is footgun-safe (the secret is matched by hash, not by literal
  # text); the literal form was a footgun (the secret was matched
  # by literal, which meant the GitGuardian dashboard's dashboard
  # would silently ignore a real copy in `src/`).
  ignored_matches:
    - name: 'synthetic API key fixture (cross-protocol dispatch — pre-existing, SHA256 of value)'
      match: 30e55e18233ca182773dcff62457830db6f9809d58833b9ff779c41553cf7917
    - name: 'synthetic API key fixture (cross-protocol dispatch — pre-existing, SHA256 of value)'
      match: 9f2a7af08c6d07c8a8c18999057d51ef567cf7c130708b7a22526de6f3db150e
    - name: 'synthetic API key fixture (cross-protocol dispatch — pre-existing, SHA256 of value)'
