# SPDX-License-Identifier: MIT
# GitGuardian configuration — per-repo secret-detection rules.
#
# Schema reference:
#   https://docs.gitguardian.com/ggshield-docs/configuration
#   https://github.com/GitGuardian/ggshield/blob/main/.gitguardian.example.yml
#
# Why this file exists
# --------------------
# UmActually's self-review pipeline uses GitGuardian's GitHub App
# to scan every PR for committed secrets. The high-entropy detector
# (ContentWhitelistPreValidator for `apiKey`, `token`, `secret`,
# `UMACTUALLY_API_KEY`, etc.) is calibrated for HIGH RECALL and
# intentionally flags any long random-looking string assigned to
# one of those variable names. This is exactly the right posture
# for production code, but it produces predictable false positives
# on the synthetic test fixtures UmActually uses throughout its
# test suite. The configurations below are calibrated to the
# current state of the repo (as of PR #50) and re-verified whenever
# a new test fixture is added.
#
# Sentinel convention
# -------------------
# All synthetic test API keys in this repo use one of these sentinels:
#   - the literal `do-not-leak` suffix (e.g. `sk-anthropic-v2-do-not-leak`,
#     `sk-test-openai-do-not-leak`, `sk-minimax-smoke-test-do-not-leak`)
#   - the literal `synthetic` or `EXAMPLE-` prefix in their value
#   - short obviously-fake values like `sk-test`, `sk-ant-test`, `test-key`,
#     `gho_test`, `gho_token`, `ghp_x`, `sk-abc123`
# The suffix/prefix is a deliberate tripwire: a maintainer who copies a
# fixture into a real config file and forgets to swap it would
# `rg do-not-leak src/` and find this comment, and the next reviewer
# who runs the secret scan would flag the literal in `src/` (which is
# intentionally NOT in `ignored_paths` below).
#
# Historical incident
# -------------------
# Incident 34696725 (2026-07-10): GitGuardian flagged
# `sk-anthropic-v2-do-not-leak` in
# test/unit/live-provider-cross-protocol-dispatch.test.ts:507 as a
# "Generic High Entropy Secret". The pre-registered SHA256s in
# `ignored_matches` below auto-resolve the corresponding dashboard
# incidents the next time the scanner runs. The dashboard incident
# was marked resolved in the GitGuardian workspace once the original
# config landed in the default branch.
#
# Update procedure (when a new synthetic key is added)
# ---------------------------------------------------
# 1. Add the literal key in your test file using the `do-not-leak`
#    suffix convention.
# 2. Compute its SHA256:
#        node -e "console.log(require('node:crypto').createHash('sha256').update('<key>').digest('hex'))"
# 3. Add the hash to `ignored_matches` below with a descriptive name.
# 4. Re-run the secret scan locally:
#        npx ggshield secret scan repo
#    and confirm the new fixture is NOT flagged.
# 5. Open a PR. GitHub Actions does NOT re-run ggshield (we
#    intentionally don't burn API quota on CI); the GitGuardian
#    GitHub App runs on PR open and on push to main.
#
# Design choices
# --------------
# - `version: 2` is required; v1 is deprecated.
# - `ignored_paths` excludes test directories and build artifacts
#   (the high-entropy detector's only consistent FP source in this
#   repo). We do NOT add a global `ignored_detectors` entry for
#   `Generic High Entropy Secret` — that would weaken detection
#   for production code (`src/`), which is the highest-stakes
#   surface for accidental secret commits.
# - `docs/**`, `**/*.md`, `LICENSE`, `CHANGELOG*` excluded per
#   GitGuardian's recommended-filepath-exclusions list.
# - `artifacts/**` excluded because the test pipeline writes
#   redaction-report fixtures and provider-response cassettes
#   there; these are checked in for the self-review regression
#   suite and routinely contain synthetic API responses.
# - `test/fixtures/**` excluded because the cross-protocol and
#   live-platform tests ship JSON provider-response cassettes
#   with embedded synthetic API keys.
# - `examples/**` is NOT excluded — the example workflows use
#   `${{ secrets.* }}` references and any committed literal in
#   that path would be a real finding.
# - `src/**` is NOT excluded — production code is the surface
#   that needs the most aggressive scanning.
# - `ignored_matches` uses bare SHA256 of the secret VALUE
#   (NO surrounding quotes). GitGuardian's parser reads the
#   match value as a plain string; quoted values are matched as
#   `'<value>'` with literal apostrophes and would not match the
#   secret in the test file. Bare scalars are the correct form
#   per the GitGuardian schema.
version: 2

secret:
  # Exclude paths that are EXPECTED to contain synthetic / sample
  # values. The high-entropy detector is reliable for src/ and
  # bin/ (real code paths) and noisy for test/ (synthetic fixtures
  # by design).
  ignored_paths:
    # Test code and test fixtures — every secret in these paths
    # follows the `do-not-leak` sentinel convention.
    - 'test/**'
    - 'tests/**'
    - '**/*.test.ts'
    - '**/*.spec.ts'
    - '**/*.test.mjs'
    - '**/test/**'
    - '**/tests/**'
    - '**/__tests__/**'
    - '**/fixtures/**'
    - '**/__snapshots__/**'
    # Build artifacts and tooling output — ncc bundles, TypeScript
    # build info, coverage reports, layout-viewer build dir.
    - 'dist/**'
    - 'dist-tmp/**'
    - 'build/**'
    - 'coverage/**'
    - '**/*.tsbuildinfo'
    - '.layout-viewer-build/**'
    # Per-run self-review artifacts — cassettes, redaction reports,
    # and manual review logs checked in for regression coverage.
    - 'artifacts/**'
    # Documentation — example API URLs and placeholder patterns
    # appear throughout. Per GitGuardian's recommended exclusion
    # list for Markdown / reStructuredText.
    - 'docs/**'
    - '**/*.md'
    - '**/*.rst'
    - 'LICENSE'
    - 'CHANGELOG*'
    # Editor / OS scratch and Playwright caches. .gitignore
    # already covers most of these, but listing them here too
    # makes the GitGuardian config self-contained.
    - '.playwright-mcp/**'
    - '.DS_Store'
    - 'Thumbs.db'
    # Dependabot / GitHub metadata — not a code surface.
    - '.github/dependabot.yml'

  # Per-occurrence ignores. The synthetic API keys below are the
  # complete set of high-entropy literals currently in `test/**`
  # (verified by `rg --no-heading 'sk-[a-zA-Z0-9_-]{6,}|gho_[a-zA-Z0-9]+|ghp_[a-zA-Z0-9]+' test/`).
  # The 9 historical SHA256s from incident 34696725 are included
  # for backward compatibility (existing dashboard incidents
  # auto-resolve on these hashes). The remaining 24 are net-new in
  # PR #50 because the test suite has grown since 2026-07-10.
  #
  # Form: bare SHA256 of the secret VALUE (NO surrounding quotes —
  # see the schema comment above for the rationale). The trailing
  # comment is the literal value, for human review when a new
  # fixture is added.
  ignored_matches:
    # Historical (incident 34696725, 2026-07-10).
    - name: 'synthetic API key fixture (cross-protocol dispatch, incident 34696725)'
      match: 30e55e18233ca182773dcff62457830db6f9809d58833b9ff779c41553cf7917  # sk-anthropic-v2-do-not-leak
    - name: 'synthetic API key fixture (cross-protocol dispatch, incident 34696725)'
